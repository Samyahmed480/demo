<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>كفو | لوحة التحكم والحساب المخصص</title>
  <!-- خطوط عربية فائقة الوضوح والجمال من Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>

  <!-- الدوائر الملونة الناعمة في الخلفية -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="app-container">

    <!-- شريط التبديل السريع بين الأدوار والواجهات -->
    <div class="role-switch-top-bar" onclick="openRoleSwitcherModal()" title="انقر لتجربة وتبديل أدوار التطبيق">
      <div class="role-switch-current">
        <span id="roleIconPill" style="font-size: 1.15rem;">🏬</span>
        <div>
          <span id="roleCurrentTitle" style="display: block; font-size: 0.88rem; font-weight: 700; color: var(--text);">لوحة تحكم التاجر</span>
          <span id="roleSubText" style="font-size: 0.72rem; color: var(--text-muted);">انقر لتبديل الدور (تاجر / مندوب / مهندس ورشة / توصيل / عميل)</span>
        </div>
      </div>
      <div class="role-switch-action">
        <span>تبديل</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>

    <!-- 1. كارت بروفايل المستخدم المخصص للدور الحالي -->
    <div class="profile-card">
      <div class="profile-avatar-wrap">
        <div class="profile-avatar" id="profileAvatarBox">
          <svg id="profileAvatarSvg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <div class="avatar-cam-badge" title="تعديل الصورة الرمزية">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
            <circle cx="12" cy="13" r="3"/>
          </svg>
        </div>
      </div>

      <div class="profile-info">
        <h2 class="profile-name" id="profileName">Mohamed Ahmed</h2>
        <span class="profile-email" id="profileEmail">webmax.ceo.1@gmail.com</span>
        <span class="profile-device-tag" id="profileBadgeTag">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="margin-left: 4px;"><polyline points="20 6 9 17 4 12"/></svg>
          <span id="profileBadgeText">تاجر معتمد · متجر كفو للقطع</span>
        </span>
      </div>
    </div>

    <!-- كارت الإحصائيات أو المميزات المخصصة للدور الحالي -->
    <div id="roleStatsContainer"></div>

    <!-- 2. عنوان لوحة التحكم المتغير -->
    <div class="section-header" style="margin-bottom: 14px; align-items: center;">
      <h1 class="section-title" id="dashboardSectionTitle" style="font-size: 1.25rem;">لوحة تحكم التاجر</h1>
      <span style="font-size: 0.78rem; font-weight: 600; color: #475569; background: rgba(15, 23, 42, 0.05); padding: 4px 12px; border-radius: var(--radius-pill);" id="dashboardSubtitle">خدمات وعمليات الحساب</span>
    </div>

    <!-- 3. قائمة خيارات لوحة التحكم المخصصة وفق الدور الحالي -->
    <div class="account-menu-list" id="accountMenuList"></div>

    <!-- زر تسجيل الخروج والتبديل -->
    <button class="btn-logout-row" id="btnLogout">
      تبديل الحساب أو تسجيل الخروج
    </button>

  </div>

  <!-- مودال عام للخيارات التفاعلية بخلفية بيضاء صلبة -->
  <div class="sheet-backdrop" id="accountActionModal">
    <div class="bottom-sheet" id="accountActionSheet">
      <div class="sheet-header">
        <div class="sheet-title-col">
          <h2 class="sheet-title" id="actionModalTitle">عنوان</h2>
          <p class="sheet-subtitle" id="actionModalDesc">وصف</p>
        </div>
        <button class="btn-close-sheet" onclick="closeActionModal()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div id="actionModalBody"></div>
    </div>
  </div>

  <!-- سكربتات التطبيق -->
  <script src="assets/js/products.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const modalBackdrop = document.getElementById('accountActionModal');
    const modalTitle = document.getElementById('actionModalTitle');
    const modalDesc = document.getElementById('actionModalDesc');
    const modalBody = document.getElementById('actionModalBody');

    function openModalWith(title, desc, contentHtml) {
      modalTitle.textContent = title;
      modalDesc.textContent = desc;
      modalBody.innerHTML = contentHtml;
      modalBackdrop.classList.add('active');
    }

    function closeActionModal() {
      modalBackdrop.classList.remove('active');
    }

    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) closeActionModal();
    });

    // =========================================================================
    // نظام العرض الديناميكي للوحات التحكم حسب الدور المختار
    // =========================================================================

    function renderActiveRoleDashboard() {
      const roleId = KafuStore.getRole();
      const role = KafuStore.getRoleData(roleId);

      // 1. تحديث شريط التبديل العلوي
      const iconMap = {
        merchant_new: '🏬',
        merchant_scrap: '🚜',
        rep_oem: '📦',
        rep_scrap: '🛠️',
        workshop: '🔧',
        courier: '🚚',
        customer: '👤'
      };
      document.getElementById('roleIconPill').textContent = iconMap[roleId] || '🏬';
      document.getElementById('roleCurrentTitle').textContent = role.title;
      document.getElementById('dashboardSectionTitle').textContent = role.dashboardTitle;

      // 2. تحديث كارت البروفايل
      document.getElementById('profileName').textContent = role.name;
      document.getElementById('profileEmail').textContent = role.email;
      document.getElementById('profileBadgeText').textContent = role.badge;

      // 3. كارت الإحصائيات أو كارت المميزات
      renderStatsOrPerksCard(roleId, role);

      // 4. عناصر قائمة الخيارات المخصصة
      renderRoleMenuList(roleId);
    }

    // عرض الإحصائيات أو المميزات
    function renderStatsOrPerksCard(roleId, role) {
      const container = document.getElementById('roleStatsContainer');
      container.innerHTML = '';

      if (roleId === 'workshop') {
        // كارت خاص لمهندس الورشة: خصم 15% + رصيد النقاط + البونص
        container.innerHTML = `
          <div class="workshop-perks-card">
            <div class="workshop-perks-header">
              <div>
                <span class="workshop-badge-gold">⭐ المستوى الذهبي المعتمد</span>
                <span style="font-size: 0.82rem; font-weight: 700; color: #92400E; margin-right: 6px;">خصم 15% ورش مفعل تلقائياً</span>
              </div>
              <button class="btn-primary" style="padding: 4px 12px; font-size: 0.78rem; background: #D97706; border-radius: var(--radius-pill);" onclick="openWorkshopPointsModal()">
                استبدال النقاط
              </button>
            </div>
            
            <div class="workshop-points-row">
              <div>
                <div style="font-size: 0.78rem; color: #92400E;">رصيد كفو بوينتس (كاش باك)</div>
                <div class="workshop-points-num font-num">1,850 <span style="font-size: 0.9rem; font-weight: 600;">نقطة (= 185 ر.س)</span></div>
              </div>
              <div style="text-align: left;">
                <div style="font-size: 0.78rem; color: #92400E;">البونص الشهري المكتسب</div>
                <div style="font-size: 1.15rem; font-weight: 800; color: #B45309;" class="font-num">420 ر.س</div>
              </div>
            </div>

            <div>
              <div style="display: flex; justify-content: space-between; font-size: 0.74rem; color: #92400E; margin-bottom: 4px;">
                <span>تارجت صيانة الشهر: 15 / 20 سيارة</span>
                <span>باقي 5 سيارات للحصول على 500 ر.س بونص إضافي!</span>
              </div>
              <div class="workshop-bonus-progress">
                <div class="workshop-bonus-bar" style="width: 75%;"></div>
              </div>
            </div>
          </div>
        `;
      } else if (roleId === 'courier') {
        // كارت خاص بمندوب التوصيل: حالة الكابتن + أرباح اليوم
        container.innerHTML = `
          <div class="courier-status-card">
            <div class="courier-status-info">
              <div class="courier-status-dot" id="courierStatusDot"></div>
              <div>
                <strong id="courierStatusText" style="font-size: 0.95rem; color: #15803D;">كابتن متصل وجاهز للاستلام</strong>
                <div style="font-size: 0.76rem; color: var(--text-muted);">نطاق التغطية: صناعية الشمال والرياض</div>
              </div>
            </div>
            <button class="courier-toggle-btn online" id="btnCourierStatusToggle" onclick="toggleCourierOnlineStatus()">
              متصل 🟢
            </button>
          </div>

          <div class="role-stats-grid">
            <div class="role-stat-box">
              <span class="role-stat-val font-num">210 ر.س</span>
              <span class="role-stat-label">أرباح مشاوير اليوم</span>
            </div>
            <div class="role-stat-box">
              <span class="role-stat-val font-num">7 شحنات</span>
              <span class="role-stat-label">تم تسليمها بنجاح</span>
            </div>
            <div class="role-stat-box">
              <span class="role-stat-val font-num" style="color: #D97706;">2 طلب</span>
              <span class="role-stat-label">شحنات قيد التوصيل</span>
            </div>
          </div>
        `;
      } else {
        // الكارت القياسي للـ Stats Grid (التاجر ومندوب المبيعات والعميل)
        const stats = role.stats || [];
        container.innerHTML = `
          <div class="role-stats-grid">
            ${stats.map(s => `
              <div class="role-stat-box">
                <span class="role-stat-val font-num">${s.val}</span>
                <span class="role-stat-label">${s.label}</span>
              </div>
            `).join('')}
          </div>
        `;
      }
    }

    // عرض قائمة الخيارات المخصصة للدور
    function renderRoleMenuList(roleId) {
      const menuContainer = document.getElementById('accountMenuList');
      menuContainer.innerHTML = '';

      let items = [];

      if (roleId === 'merchant_new' || roleId === 'merchant_scrap') {
        // لوحة تحكم التاجر (قطع جديدة أو تشاليح)
        items = [
          {
            title: 'طلبات العملاء الواردة',
            desc: 'متابعة مبيعات المتجر وتأكيد الشحن والتجهيز',
            iconBg: 'var(--tile-peach)',
            iconColor: 'var(--tile-peach-icon)',
            icon: `<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>`,
            action: 'openIncomingOrdersModal()'
          },
          {
            title: 'عنوان المستودع وموقع المتجر',
            desc: 'مقر المستودع ونقطة تسليم شحنات الكباتن',
            iconBg: 'var(--tile-teal)',
            iconColor: 'var(--tile-teal-icon)',
            icon: `<path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"/><circle cx="12" cy="10" r="3"/>`,
            action: 'openMerchantAddressModal()'
          },
          {
            title: roleId === 'merchant_scrap' ? 'إضافة سيارة تشليح أو سكراب' : 'إضافة قطعة وتحديد السعر',
            desc: roleId === 'merchant_scrap' ? 'تسجيل مركبة سكراب وتفكيك القطع بالأسعار' : 'تسجيل قطعة جديدة بمواصفات كفو وتحديد السعر',
            iconBg: '#DCEAFE',
            iconColor: 'var(--primary)',
            icon: `<path d="M12 5v14M5 12h14"/>`,
            action: 'openAddProductPriceModal()'
          },
          {
            title: 'طلبات تسعير العملاء الواردة',
            desc: 'تسعير استفسارات أرقام الهيكل VIN للعملاء',
            iconBg: 'var(--tile-peach)',
            iconColor: 'var(--tile-peach-icon)',
            icon: `<path d="m20.59 13.41-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>`,
            action: 'openMerchantQuoteRepliesModal()'
          },
          {
            title: 'محفظة التاجر والأرباح',
            desc: 'عائدات المبيعات وسحب الأرباح البنكية الفوري',
            iconBg: '#CBEAE7',
            iconColor: '#0F766E',
            icon: `<rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>`,
            action: 'openMerchantWalletModal()'
          },
          {
            title: roleId === 'merchant_scrap' ? 'قطع التشليح وسيارات السكراب' : 'قطع المتجر والمخزون المعروض',
            desc: 'إدارة الأسعار وتحديث توفر قطع الغيار',
            iconBg: 'var(--tile-lavender)',
            iconColor: 'var(--tile-lavender-icon)',
            icon: `<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>`,
            action: 'openInventoryModal()'
          },
          {
            title: 'مساعد كفو ومطابقة VIN',
            desc: 'فحص رقم الهيكل ومطابقة كتالوجات المصنع',
            iconBg: 'var(--tile-orange)',
            iconColor: 'var(--tile-orange-icon)',
            icon: `<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>`,
            action: 'openAssistantModal()'
          },
          {
            title: 'إعدادات المتجر والرقم الضريبي',
            desc: 'الرقم الضريبي ZATCA وتفضيلات الحساب',
            iconBg: 'var(--tile-yellow)',
            iconColor: 'var(--tile-yellow-icon)',
            icon: `<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1 2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>`,
            action: 'openSettingsModal()'
          }
        ];
      } else if (roleId === 'rep_oem' || roleId === 'rep_scrap') {
        // لوحة تحكم مندوب المبيعات (زى واجهة التاجر)
        items = [
          {
            title: 'طلبات العملاء والورش المسندة',
            desc: 'متابعة وتجهيز طلبيات الورش والعملاء وإتمام البيع',
            iconBg: 'var(--tile-peach)',
            iconColor: 'var(--tile-peach-icon)',
            icon: `<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>`,
            action: 'openRepAssignedOrdersModal()'
          },
          {
            title: 'تقديم عروض الأسعار والعمولات',
            desc: 'تسعير القطع للعملاء بنسبة عمولتك المباشرة',
            iconBg: '#DCEAFE',
            iconColor: 'var(--primary)',
            icon: `<path d="m20.59 13.41-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>`,
            action: 'openRepQuotesModal()'
          },
          {
            title: 'إضافة قطع وتحديث أسعار الموردين',
            desc: 'ربط قطع الوكلاء والمستودعات الشريكة في كفو',
            iconBg: 'var(--tile-teal)',
            iconColor: 'var(--tile-teal-icon)',
            icon: `<path d="M12 5v14M5 12h14"/>`,
            action: 'openAddProductPriceModal()'
          },
          {
            title: 'محفظة عمولات المبيعات',
            desc: 'عائدات العمولات المباشرة وسحب الرصيد البنكي',
            iconBg: '#CBEAE7',
            iconColor: '#0F766E',
            icon: `<rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>`,
            action: 'openRepWalletModal()'
          },
          {
            title: 'شبكة الورش ومراكز الصيانة التابعة',
            desc: '19 ورشة معتمدة تطلب قطعها عبر حسابك المندوب',
            iconBg: 'var(--tile-lavender)',
            iconColor: 'var(--tile-lavender-icon)',
            icon: `<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>`,
            action: 'openRepWorkshopsModal()'
          },
          {
            title: 'مسار الزيارات الميدانية للورش',
            desc: 'تنظيم جولاتك اليومية على المناطق الصناعية والتشاليح',
            iconBg: 'var(--tile-orange)',
            iconColor: 'var(--tile-orange-icon)',
            icon: `<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 14 14"/>`,
            action: 'openRepFieldVisitsModal()'
          },
          {
            title: 'فاحص VIN وكتالوجات الوكالة',
            desc: 'مطابقة رقم الشاسيه والتأكد من توافق القطعة قبل البيع',
            iconBg: 'var(--tile-blue)',
            iconColor: 'var(--tile-blue-icon)',
            icon: `<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>`,
            action: 'openAssistantModal()'
          },
          {
            title: 'إعدادات حساب المندوب',
            desc: 'بيانات الحساب البنكي لتحويل العمولات ونطاق العمل',
            iconBg: 'var(--tile-yellow)',
            iconColor: 'var(--tile-yellow-icon)',
            icon: `<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>`,
            action: 'openSettingsModal()'
          }
        ];
      } else if (roleId === 'workshop') {
        // لوحة تحكم مهندس الورشة (يطلب مثل العميل ومميز ببونص وخصم ونقاط)
        items = [

        { id: 'rep_oem', title: 'مندوب مبيعات قطع أصلية', group: 'مندوب مبيعات', icon: '📦', badge: 'عمولات مباشرة' },
        { id: 'rep_scrap', title: 'مندوب مبيعات تشاليح ومستعمل', group: 'مندوب مبيعات', icon: '🛠️', badge: 'تشاليح ميداني' },

      ];

      const html = `
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div style="font-size: 0.84rem; color: var(--text-muted); margin-bottom: 4px;">
            اختر أي دور من الأدوار الـ 7 لتجربة لوحة التحكم المخصصة الخاصة به فوراً:

          ${rolesList.map(r => `
            <div onclick="applyRoleSwitch('${r.id}')" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: 16px; border: 1.5px solid ${r.id === activeId ? 'var(--primary)' : '#E2E8F0'}; background: ${r.id === activeId ? '#EFF6FF' : '#FFFFFF'}; cursor: pointer; transition: all 0.2s ease;">

                  <div style="font-weight: 700; font-size: 0.95rem; color: var(--text);">${r.title}</div>

                </div>
              </div>
              <div>
                ${r.id === activeId 
                  ? `<span style="width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700;">✓</span>`
                  : `<span style="font-size: 0.8rem; color: var(--primary); font-weight: 700;">تفعيل</span>`
                }
              </div>
            </div>
          `).join('')}

          <div style="padding-top: 10px; border-top: 1px solid #E2E8F0; margin-top: 6px;">

      openModalWith('تبديل نوع الحساب والدور', 'اختر الواجهة التي ترغب في استعراضها والعمل بها', html);

    function applyRoleSwitch(roleId) {
      KafuStore.setRole(roleId);
      closeActionModal();
      renderActiveRoleDashboard();
      KafuApp.showToast(`تم تفعيل واجهة: ${KafuStore.ROLES[roleId].shortTitle}`);
    }

    function toggleCourierOnlineStatus() {
      const btn = document.getElementById('btnCourierStatusToggle');
      const text = document.getElementById('courierStatusText');
      const dot = document.getElementById('courierStatusDot');
      const isOnline = btn.classList.contains('online');

      if (isOnline) {
        btn.classList.remove('online');
        btn.textContent = 'غير متصل 🔴';
        btn.style.background = '#FEE2E2';
        btn.style.color = '#B91C1C';
        btn.style.borderColor = '#FCA5A5';
        text.textContent = 'أنت الآن في وضع غير متاح لاستلام الشحنات';
        text.style.color = 'var(--text-muted)';
        dot.style.background = '#EF4444';
        dot.style.boxShadow = 'none';
        KafuApp.showToast('تم إيقاف استقبال الطلبات مؤقتاً');
      } else {
        btn.classList.add('online');
        btn.textContent = 'متصل 🟢';
        btn.style.background = '#DCFCE7';
        btn.style.color = '#15803D';
        btn.style.borderColor = '#86EFAC';
        text.textContent = 'كابتن متصل وجاهز للاستلام';
        text.style.color = '#15803D';
        dot.style.background = '#22C55E';
        dot.style.boxShadow = '0 0 0 4px rgba(34, 197, 94, 0.2)';
        KafuApp.showToast('أنت الآن متصل وتستقبل طلبات الشحن!');
      }
    }

    function calcRepCommission() {

      document.getElementById('repCommissionDisplay').textContent = `${comm} ر.س`;
    }

      openModalWith('مساعد كفو وفاحص الهيكل (VIN)', 'تأكيد مطابقة القطعة مع كتالوج الوكالة الرسمي', `
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <div style="background: var(--primary-light); padding: 12px; border-radius: var(--radius-md); font-size: 0.86rem; color: var(--primary-dark);">
            أدخل رقم الشاسيه (17 رمزاً) أو كود OEM للتأكد من مطابقة القطعة مع كتالوج الوكالة بدقة 100%.
          </div>
          <input type="text" placeholder="أدخل رقم الهيكل (VIN) أو كود القطعة" class="form-input ltr" style="text-align: right;" value="4T1B11HK5SU89201">
          <button class="btn-primary" onclick="KafuApp.showToast('تم التحقق: القطعة متوافقة 100% مع مواصفات المصنع ✓'); closeActionModal();">
            فحص المطابقة الفورية الآن
          </button>
        </div>
      `);
    }

    function openSettingsModal() {
      const isHindi = localStorage.getItem(KafuStore.KEYS.USE_HINDI_NUMS) !== 'false';
      openModalWith('إعدادات الحساب وتنسيق البيانات', 'خيارات العرض وتنسيق الأسعار والبيانات التجارية', `
        <div style="display: flex; flex-direction: column; gap: 14px;">
          <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #EDF2F7;">
            <div>
              <div style="font-weight: 700; font-size: 0.92rem;">الرقم الضريبي المعتمد (VAT ID)</div>
              <div style="font-size: 0.78rem; color: var(--text-muted); font-family: monospace;">302918294800003</div>
            </div>
            <span style="font-size: 0.75rem; color: #15803D; background: #DCFCE7; padding: 3px 8px; border-radius: 6px; font-weight: 700;">مفعل وموثق</span>
          </div>

          <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #EDF2F7;">
            <div>
              <div style="font-weight: 700; font-size: 0.92rem;">الأرقام العربية المشرقية (١٢٣)</div>
              <div style="font-size: 0.78rem; color: var(--text-muted);">تنسيق الأرقام والأسعار في المتجر</div>
            </div>
            <input type="checkbox" id="toggleHindiNums" ${isHindi ? 'checked' : ''} style="width: 20px; height: 20px;" onchange="localStorage.setItem(KafuStore.KEYS.USE_HINDI_NUMS, this.checked ? 'true' : 'false'); KafuApp.showToast('تم تحديث تنسيق الأرقام'); setTimeout(() => location.reload(), 600);">
          </div>

          <div style="padding-top: 8px;">
            <button class="btn-secondary" style="width: 100%; color: var(--danger); border-color: rgba(255,59,48,0.3);" onclick="localStorage.clear(); KafuStore.init(); KafuApp.showToast('تمت إعادة ضبط البيانات الافتراضية'); setTimeout(() => location.reload(), 800);">
              إعادة ضبط البيانات الافتراضية
            </button>
          </div>
        </div>
      `);
    }

    // =========================================================================
    // التهيئة عند تحميل الصفحة
    // =========================================================================
    document.addEventListener('DOMContentLoaded', () => {
      // 1. تفعيل تبويب الملف الشخصي في شريط التنقل السفلي
      KafuApp.renderBottomNav('account');

      // 2. رسم لوحة التحكم الحالية حسب الدور
      renderActiveRoleDashboard();

      // 3. زر تسجيل الخروج / التبديل
      document.getElementById('btnLogout').addEventListener('click', () => {
        if (confirm('هل ترغب بتسجيل الخروج واختيار نوع حساب آخر؟')) {
          window.location.href = 'auth.html';
        }
      });
    });
  </script>
</body>
</html>
