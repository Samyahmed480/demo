<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>كفو | البحث عن قطع الغيار ورقم الهيكل</title>
  <meta name="description" content="ابحث باسم القطعة أو رقم الهيكل (VIN) في آلاف قطع غيار السيارات الأصلية.">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    .filter-chips-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 18px;
      scrollbar-width: none;
    }
    .filter-chips-row::-webkit-scrollbar {
      display: none;
    }
    .chip {
      white-space: nowrap;
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .chip.active {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(10, 108, 255, 0.25);
    }
  </style>
</head>
<body>

  <!-- الدوائر الملونة الناعمة في الخلفية -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="app-container">

    <!-- شريط البحث العلوي: ابحث باسم القطعة أو رقم الهيكل (البحث بالعدسة) -->
    <div class="search-bar-wrap" style="margin-bottom: 14px;">
      <div class="search-pill glass" style="height: 54px; padding: 0 16px;">
        <button id="btnLensSearch" class="search-icon-right" style="cursor: pointer; padding: 4px; display: flex; align-items: center; color: var(--primary); transition: transform var(--transition-fast);" title="بحث">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.3-4.3"/>
          </svg>
        </button>
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="ابحث باسم القطعة أو رقم الهيكل" 
          autofocus
          autocomplete="off"
        >
        <button id="btnClearSearch" style="color: var(--text-muted); display: none; padding: 6px; cursor: pointer;" title="مسح">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- فلاتر الفئات السريعة -->
    <div class="filter-chips-row" id="categoryChips">
      <button class="chip active" data-category="all">الكل</button>
      <button class="chip" data-category="engine">المحرك</button>
      <button class="chip" data-category="brakes">الفرامل</button>
      <button class="chip" data-category="electrical">الكهرباء</button>
      <button class="chip" data-category="oils">الزيوت والفلاتر</button>
      <button class="chip" data-category="suspension">التعليق</button>
      <button class="chip" data-category="lighting">الإضاءة</button>
    </div>

    <!-- كارت سيارة المطابقة المدمج -->
    <div class="vehicle-match-card glass" id="searchVehicleCard" style="margin-bottom: 16px; padding: 10px 14px;">
      <div class="vehicle-match-info" style="gap: 10px;">
        <div class="vehicle-icon-box" style="width: 38px; height: 38px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/>
            <path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/>
            <circle cx="17" cy="18.5" r="2.5"/><circle cx="7" cy="18.5" r="2.5"/>
          </svg>
        </div>
        <div class="vehicle-text-col">
          <span class="vehicle-meta-label" style="font-size: 0.72rem;">مطابقة التوافق مع</span>
          <span class="vehicle-active-name" style="font-size: 0.88rem;">Toyota Camry 2025</span>
        </div>
      </div>
      <button style="font-size: 0.8rem; color: var(--primary); font-weight: 700;">تغيير</button>
    </div>

    <!-- Empty State -->
    <div id="searchEmptyState" class="glass" style="padding: 44px 20px; text-align: center; border-radius: var(--radius-sheet); margin-top: 10px;">
      <div style="width: 72px; height: 72px; border-radius: 50%; background: #DCEAFE; color: var(--primary); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.3-4.3"/>
        </svg>
      </div>
      <h2 style="font-size: 1.35rem; font-weight: 700; margin-bottom: 6px; color: var(--text);">ابحث عن قطعتك</h2>
      <p style="font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; max-width: 300px; margin: 0 auto 20px;">
        اكتب اسم القطعة أو رقم الهيكل (VIN) للحصول على نتائج مطابقة لسيارتك بدقة 100%.
      </p>

      <!-- اقتراحات سريعة -->
      <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;">
        <button class="chip" onclick="quickFill('فلتر زيت كامري')">فلتر زيت كامري</button>
        <button class="chip" onclick="quickFill('طقم مكبس محرك')">طقم مكبس محرك</button>
        <button class="chip" onclick="quickFill('4T1B11HK5SU')">رقم هيكل كامري</button>
        <button class="chip" onclick="quickFill('فحمات فرامل')">فحمات فرامل</button>
      </div>
    </div>

    <!-- قائمة نتائج البحث -->
    <div id="searchResultsSection" style="display: none;">
      <div class="section-header">
        <h2 class="section-title" id="resultsCountTitle">النتائج</h2>
      </div>
      <div class="products-list" id="searchResultsList"></div>
    </div>

  </div>

  <!-- سكربتات التطبيق -->
  <script src="assets/js/products.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('btnClearSearch');
    const lensBtn = document.getElementById('btnLensSearch');
    const emptyState = document.getElementById('searchEmptyState');
    const resultsSection = document.getElementById('searchResultsSection');
    const resultsList = document.getElementById('searchResultsList');
    const resultsCountTitle = document.getElementById('resultsCountTitle');
    const chips = document.querySelectorAll('.chip[data-category]');

    let activeCategory = 'all';

    function quickFill(term) {
      searchInput.value = term;
      executeSearch();
    }

    function executeSearch() {
      const q = searchInput.value.trim().toLowerCase();
      clearBtn.style.display = q ? 'block' : 'none';

      const selectedCar = KafuStore.getSelectedCar();

      let filtered = PRODUCTS.filter(p => {
        const catMatch = (activeCategory === 'all' || p.category === activeCategory);
        if (!catMatch) return false;

        if (!q) return true;

        const nameMatch = p.name.toLowerCase().includes(q);
        const brandMatch = p.brand.toLowerCase().includes(q);
        const oemMatch = p.oem.toLowerCase().includes(q);

        // فحص رقم الهيكل (VIN)
        const vinMatch = p.compatibleCars.some(c => 
          c.vinPrefixes && c.vinPrefixes.some(v => q.toUpperCase().includes(v))
        );

        const carMatch = p.compatibleCars.some(c => 
          c.make.toLowerCase().includes(q) || 
          c.model.toLowerCase().includes(q)
        );

        return nameMatch || brandMatch || oemMatch || vinMatch || carMatch;
      });

      if (!q && activeCategory === 'all') {
        emptyState.style.display = 'block';
        resultsSection.style.display = 'none';
        return;
      }

      emptyState.style.display = 'none';
      resultsSection.style.display = 'block';
      resultsCountTitle.textContent = `تم العثور على (${KafuStore.formatNumber(filtered.length)}) قطعة`;

      if (filtered.length === 0) {
        resultsList.innerHTML = `
          <div class="glass" style="padding: 30px; text-align: center; border-radius: var(--radius-card);">
            <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 12px;">لم يتم العثور على قطع مطابقة للبحث أو لرقم الهيكل المدخل.</p>
            <a href="account.html" class="btn-primary" style="display:inline-flex; width:auto; padding:0 20px; font-size:0.85rem;">
              طلب تسعير قطعة خاصة
            </a>
          </div>
        `;
        return;
      }

      resultsList.innerHTML = filtered.map(p => {
        const comp = checkCompatibility(p, selectedCar);
        const compClass = comp.status === 'compatible' ? 'color:#15803D;' : 'color:#B91C1C;';

        return `
          <div class="product-card glass glass-card-interactive" onclick="window.location.href='product.html?id=${p.id}'">
            <div class="product-img-box">
              <img src="${p.image}" alt="${p.name}" loading="lazy">
            </div>
            <div class="product-info-col">
              <div class="product-top-row">
                <span class="product-brand">${p.brand}</span>
                <span class="badge-available">متوفر</span>
              </div>
              <h3 class="product-title">${p.name}</h3>
              <div class="product-oem-row">
                <span>رقم القطعة:</span>
                <span class="oem-code ltr">${p.oem}</span>
              </div>
              <div style="font-size:0.75rem; font-weight:600; ${compClass} margin-top:2px;">
                ${comp.text}
              </div>
              <div class="product-bottom-row">
                <span class="product-price">${KafuStore.formatPrice(p.price)}</span>
                <button 
                  class="btn-add-cart-mini" 
                  title="أضف إلى السلة" 
                  onclick="event.stopPropagation(); KafuStore.addToCart(PRODUCTS.find(x => x.id === '${p.id}')); KafuApp.showToast('تمت إضافة ${p.name} للسلة ✓');"
                >
                  ${KafuApp.ICONS.plus}
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      // شريط التنقل مع تفعيل تبويب 'search'
      KafuApp.renderBottomNav('search');

      // ربط كارت السيارة
      KafuApp.bindVehicleCard(document.getElementById('searchVehicleCard'));

      const urlParams = new URLSearchParams(window.location.search);
      const queryParam = urlParams.get('q');
      const catParam = urlParams.get('category');

      if (catParam) {
        activeCategory = catParam;
        chips.forEach(c => {
          c.classList.toggle('active', c.dataset.category === catParam);
        });
      }

      if (queryParam) {
        searchInput.value = queryParam;
      }

      if (queryParam || catParam) {
        executeSearch();
      }

      searchInput.addEventListener('input', executeSearch);
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') executeSearch();
      });
      if (lensBtn) lensBtn.addEventListener('click', executeSearch);

      clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        executeSearch();
        searchInput.focus();
      });

      chips.forEach(chip => {
        chip.addEventListener('click', () => {
          chips.forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          activeCategory = chip.dataset.category;
          executeSearch();
        });
      });
    });
  </script>
</body>
</html>
