<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>كفو | منصة الورشة والمهندس الفني الشاملة</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/components.css">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #F1F5F9;
      font-family: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #0F172A;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .workshop-page-shell {
      width: 100%;
      max-width: 960px;
      min-height: 100vh;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 35px rgba(15, 23, 42, 0.06);
      position: relative;
    }

    /* Top Sticky Header */
    .workshop-top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #E2E8F0;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .nav-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #0F172A;
      font-weight: 700;
      font-size: 0.88rem;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      padding: 8px 14px;
      border-radius: 12px;
      transition: background 0.2s;
    }
    .nav-back-btn:hover {
      background: #F1F5F9;
    }

    .workshop-page-title {
      font-size: 1.05rem;
      font-weight: 900;
      color: #0A2540;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .workshop-main-container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      flex: 1;
    }

    /* Floating Kafu AI Widget */
    .floating-kafu-ai {
      position: fixed;
      bottom: 24px;
      left: 20px;
      z-index: 999;
      background: linear-gradient(135deg, #4F46E5 0%, #06B6D4 100%);
      color: #FFFFFF;
      border: none;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
      transition: transform 0.2s ease;
    }
    .floating-kafu-ai:hover {
      transform: translateY(-2px);
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }

    @media (max-width: 640px) {
      .workshop-main-container {
        padding: 12px;
        gap: 14px;
      }
    }
  </style>
</head>
<body>

  <div class="workshop-page-shell">
    
    <!-- 1. شريط التنقل العلوي -->
    <header class="workshop-top-nav">
      <div style="display: flex; align-items: center; gap: 10px;">
        <a href="account.html" class="nav-back-btn" title="العودة للحساب">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
          <span>حسابي</span>
        </a>
        <div class="workshop-page-title">
          <span>🛠️</span>
          <span>منصة الورشة والمهندس</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 8px;">
        <a href="index.html" class="nav-back-btn" style="padding: 8px 12px; font-size: 0.80rem;">
          <span>الرئيسية 🏠</span>
        </a>
        <button type="button" onclick="KafuWorkshopPortal.openAiRepairCopilotModal()" class="nav-back-btn" style="background: #EEF2FF; color: #4F46E5; border-color: #C7D2FE; font-weight: 800;">
          <span>مساعد كفو AI 🤖</span>
        </button>
      </div>
    </header>

    <!-- 2. المحتوى الرئيسي للمنصة -->
    <main class="workshop-main-container">
      
      <!-- كارت بيانات الورشة ورصيد النقاط والخصم -->
      <section id="workshopHeaderData"></section>

      <!-- شريط تحديد تخصص ونوع الورشة (سمكرة، بوية، ميزان...) -->
      <section id="workshopSpecSelector"></section>

      <!-- شريط ستوري الورشة وفيديوهات توثيق الشغل (قبل وبعد) -->
      <section id="workshopStoriesContainer"></section>

      <!-- بانر موقع الورشة على الخريطة + تتبع شاحنة كفو السريعة وحركة القطع والمندوب -->
      <section id="workshopLocationTrackingContainer"></section>

      <!-- سيارات الورشة قيد الصيانة + تصوير الخراب + مشاركة الفاتورة للعميل + التسعيرة المنافسة -->
      <section id="workshopActiveCarsContainer"></section>

      <!-- تبويبات تقسيم وتصفح شراء القطع (أصلي وكالة OEM، تجاري درجة أولى، تشليح ومستعمل بضمان) -->
      <section id="workshopPartsCatalogContainer"></section>

      <!-- مساعد كفو AI الفني لإصلاح الأعطال وأكواد OBD-II وعزم الشد المعتمد -->
      <section id="workshopAiAssistantContainer"></section>

    </main>

  </div>

  <!-- الزر العائم لمساعد كفو AI الفني -->
  <button type="button" class="floating-kafu-ai" onclick="KafuWorkshopPortal.openAiRepairCopilotModal()">
    <span>🤖</span>
    <span>كفو AI المهندس</span>
  </button>

  <!-- سكربتات المنصة -->
  <script src="assets/js/products.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/workshop-portal.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.KafuWorkshopPortal && KafuWorkshopPortal.init) {
        KafuWorkshopPortal.init();
      }
    });
  </script>
</body>
</html>
