<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>كفو | شحنات ومشاوير كابتن التوصيل</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/components.css">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #F1F5F9;
      font-family: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #0F172A;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .orders-page-shell {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 35px rgba(15, 23, 42, 0.06);
      position: relative;
    }

    .orders-top-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1.5px solid #E2E8F0;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-back-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #0F172A;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .header-back-btn:hover {
      background: #EFF6FF;
      border-color: #BFDBFE;
      color: #0066FF;
    }

    .orders-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 14px 16px 0 16px;
    }

    .stat-mini-card {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }

    .stat-mini-val {
      font-size: 1.15rem;
      font-weight: 900;
      color: #0066FF;
      margin-bottom: 2px;
    }

    .stat-mini-lbl {
      font-size: 0.72rem;
      color: #64748B;
      font-weight: 600;
    }

    .orders-main-content {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
  </style>
</head>
<body>

  <div class="orders-page-shell">
    
    <!-- 1. الشريط العلوي مع زر الرجوع لصفحة الحساب -->
    <header class="orders-top-header">
      <div style="display: flex; align-items: center; gap: 10px;">
        <a href="account.html" class="header-back-btn" title="الرجوع إلى الحساب">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </a>
        <div>
          <h1 style="font-size: 1.15rem; font-weight: 900; color: #0A2540;">شحنات كابتن التوصيل</h1>
          <p style="font-size: 0.74rem; color: #64748B;">استلام الطرود من المستودعات والتسليم الميداني</p>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 6px;">
        <span style="font-size: 0.76rem; background: #DCFCE7; color: #15803D; padding: 4px 10px; border-radius: 999px; font-weight: 700;">
          متصل ومستعد للتوصيل ✓
        </span>
      </div>
    </header>

    <!-- 2. بطاقات الإحصائيات السريعة -->
    <div class="orders-stats-grid">
      <div class="stat-mini-card">
        <div class="stat-mini-val" id="statNewOrders">0</div>
        <div class="stat-mini-lbl">شحنات واردة جديدة</div>
      </div>
      <div class="stat-mini-card">
        <div class="stat-mini-val" id="statConfirmedOrders" style="color: #0284C7;">0</div>
        <div class="stat-mini-lbl">في الطريق للعميل</div>
      </div>
      <div class="stat-mini-card">
        <div class="stat-mini-val" id="statDeliveredOrders" style="color: #16A34A;">0</div>
        <div class="stat-mini-lbl">تم تسليمها برمز OTP</div>
      </div>
    </div>

    <!-- 3. المحتوى الأساسي والتبويبات والبحث والبطاقات -->
    <main class="orders-main-content" id="ordersMainContainer">
      <!-- يتم حقنه ديناميكياً بواسطة KafuMerchantOrders -->
    </main>

  </div>

  <!-- سكربتات التطبيق -->
  <script src="assets/js/products.js"></script>
  <script src="assets/js/store.js"></script>
  <script>
    window.__kafu_force_role = 'courier';
  </script>
  <script src="assets/js/merchant-orders.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    function updateHeaderStats() {
      if (window.KafuMerchantOrders) {
        const counts = KafuMerchantOrders.getCounts();
        document.getElementById('statNewOrders').textContent = counts.incoming;
        document.getElementById('statConfirmedOrders').textContent = counts.confirmed;
        document.getElementById('statDeliveredOrders').textContent = counts.delivered;
      }
    }

    function renderPage() {
      const container = document.getElementById('ordersMainContainer');
      if (container && window.KafuMerchantOrders) {
        container.innerHTML = KafuMerchantOrders.renderOrdersModalHtml(KafuMerchantOrders.activeTab, KafuMerchantOrders.searchQuery);
        updateHeaderStats();
      }
    }

    const originalRefresh = KafuMerchantOrders.refreshOrdersModal.bind(KafuMerchantOrders);
    KafuMerchantOrders.refreshOrdersModal = function() {
      originalRefresh();
      renderPage();
    };

    document.addEventListener('DOMContentLoaded', () => {
      renderPage();
    });
  </script>
</body>
</html>
