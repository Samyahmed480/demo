<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>كفو | منصة كابتن التوصيل (Driver User Journey)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/components.css">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #F1F5F9;
      font-family: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #0F172A;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .courier-page-shell {
      width: 100%;
      max-width: 680px;
      min-height: 100vh;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 35px rgba(15, 23, 42, 0.06);
      position: relative;
    }

    /* Top Sticky Header */
    .courier-top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1.5px solid #E2E8F0;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .nav-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #0F172A;
      font-weight: 700;
      font-size: 0.85rem;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      padding: 7px 12px;
      border-radius: 12px;
      transition: background 0.2s;
    }
    .nav-back-btn:hover {
      background: #F1F5F9;
    }

    .courier-page-title {
      font-size: 1rem;
      font-weight: 900;
      color: #0A2540;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .courier-main-container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    /* Radar Pulse Animation */
    @keyframes radarPulse {
      0% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(22, 163, 74, 0); }
      100% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
    }

    .radar-active-pulse {
      animation: radarPulse 2s infinite;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      height: 5px;
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }

    @media (max-width: 640px) {
      .courier-main-container {
        padding: 12px;
        gap: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="courier-page-shell">
    
    <!-- 1. شريط التنقل العلوي -->
    <header class="courier-top-nav">
      <div style="display: flex; align-items: center; gap: 8px;">
        <a href="account.html" class="nav-back-btn" title="العودة للحساب">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
          <span>حسابي</span>
        </a>
        <div class="courier-page-title">
          <span>🚚</span>
          <span>منصة كابتن التوصيل</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 6px;">
        <a href="index.html" class="nav-back-btn" style="padding: 7px 10px; font-size: 0.78rem;">
          <span>الرئيسية 🏠</span>
        </a>
        <button type="button" onclick="KafuCourierPortal.openAuthModal()" class="nav-back-btn" style="background: #EFF6FF; color: #0066FF; border-color: #BFDBFE; font-weight: 800; padding: 7px 10px; font-size: 0.78rem;">
          <span>رمز OTP 🔐</span>
        </button>
      </div>
    </header>

    <!-- 2. المحتوى الرئيسي لمنصة المندوب -->
    <main class="courier-main-container">
      
      <!-- 1. رأس الصفحة وحالة المندوب (Driver Status & Online Toggle) -->
      <section id="courierHeader"></section>

      <!-- 2. شريط التبويبات والملاحة (المتاحة، النشطة، السجل، المحفظة) -->
      <section id="courierTabsNav"></section>

      <!-- 3. المحتوى المتغير حسب التبويب المختار -->
      <section id="courierMainContent"></section>

    </main>

  </div>

  <!-- سكربتات المنصة -->
  <script src="assets/js/products.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/courier-portal.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.KafuCourierPortal && KafuCourierPortal.init) {
        KafuCourierPortal.init();
      }
    });
  </script>
</body>
</html>
