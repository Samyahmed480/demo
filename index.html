<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>كفو | متجر قطع غيار السيارات</title>
  <meta name="description" content="متجر كفو لقطع غيار السيارات الأصلية مع مطابقة دقيقة لسيارتك وتوصيل سريع.">
  <!-- خطوط عربية فائقة الوضوح والجمال من Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>

  <!-- الدوائر الملونة الناعمة في الخلفية -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="app-container">

    <!-- 1. Hero Card: الشعار والاسم على اليمين وأزرار الإجراءات على اليسار (RTL متناسق) -->
    <header class="hero-card">
      <svg class="hero-watermark" viewBox="0 0 100 100" fill="currentColor">
        <path d="M50 35a15 15 0 1 0 0 30 15 15 0 0 0 0-30zm0 10a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/>
        <path d="M85 45h-6.2a34.8 34.8 0 0 0-4-9.6l4.4-4.4a3 3 0 0 0 0-4.2l-7-7a3 3 0 0 0-4.2 0l-4.4 4.4a34.8 34.8 0 0 0-9.6-4V15a3 3 0 0 0-3-3h-10a3 3 0 0 0-3 3v6.2a34.8 34.8 0 0 0-9.6 4l-4.4-4.4a3 3 0 0 0-4.2 0l-7 7a3 3 0 0 0 0 4.2l4.4 4.4a34.8 34.8 0 0 0-4 9.6H15a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h6.2a34.8 34.8 0 0 0 4 9.6l-4.4 4.4a3 3 0 0 0 0 4.2l7 7a3 3 0 0 0 4.2 0l4.4-4.4a34.8 34.8 0 0 0 9.6 4V85a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-6.2a34.8 34.8 0 0 0 9.6-4l4.4 4.4a3 3 0 0 0 4.2 0l7-7a3 3 0 0 0 0-4.2l-4.4-4.4a34.8 34.8 0 0 0 4-9.6H85a3 3 0 0 0 3-3V48a3 3 0 0 0-3-3z"/>
      </svg>

      <!-- الشريط العلوي داخل الهيرو: الملف الشخصي والاسم باليمين، وأزرار اللغة والإشعارات والسلة باليسار -->
      <div class="hero-top-bar">
        <!-- الملف الشخصي والصورة على اليمين في RTL (بديلاً للشعار القديم) -->
        <a href="account.html" class="hero-user-profile" title="الملف الشخصي والحساب" aria-label="الملف الشخصي والحساب">
          <div class="hero-user-avatar-wrap">
            <img src="assets/images/avatar.jpg" alt="صورة الملف الشخصي" class="hero-user-avatar">
            <span class="hero-user-status-dot"></span>
          </div>
        </a>

        <!-- أزرار الإجراءات على اليسار: اللغة، الإشعارات، والسلة في الأعلى -->
        <div class="hero-actions">
          <button class="btn-icon-glass" id="btnLanguage" title="تغيير اللغة" aria-label="تغيير اللغة">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9.5"/>
              <path d="M12 2.5a14 14 0 0 0 0 19 14 14 0 0 0 0-19"/>
              <path d="M2.5 12h19"/>
            </svg>
          </button>
          <button class="btn-icon-glass" id="btnNotifications" title="الإشعارات" aria-label="الإشعارات">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
              <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
            </svg>
          </button>
          <!-- السلة انتقلت للأعلى متبقاش تحت مع عداد ديناميكي -->
          <a href="cart.html" class="btn-icon-glass hero-cart-btn" id="heroCartBtn" title="سلة المشتريات" aria-label="سلة المشتريات">
            <span class="badge-count" id="heroCartBadge" style="display:none">0</span>
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8" cy="21" r="1.25"/>
              <circle cx="19" cy="21" r="1.25"/>
              <path d="M2.05 2.05h2.4l2.5 12.2a2 2 0 0 0 1.96 1.6h9.8a2 2 0 0 0 1.96-1.6l1.5-7.4H5.2"/>
            </svg>
          </a>
        </div>
      </div>

      <!-- الترحيب والسيارة والدور (بدون أي تكرار وبدون أي إيموجي) -->
      <div class="hero-content">
        <h1 class="hero-title">أهلاً بك، <span id="heroUserName">محمد أحمد</span></h1>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">
          <div class="hero-vehicle-badge">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><circle cx="17" cy="18.5" r="2.5"/><circle cx="7" cy="18.5" r="2.5"/>
            </svg>
            <span id="heroSubtitle">Toyota Camry 2025</span>
          </div>

          <!-- شارة نوع الحساب بريميوم بدون أي إيموجي وبدون تبديل -->
          <div id="heroRoleBadge" class="hero-role-pill">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span id="heroRoleTitle">متجر قطع غيار جديدة</span>
          </div>
        </div>
      </div>
    </header>

    <!-- 2. شريط البحث الموحد: "ابحث باسم القطعة أو رقم الهيكل" مع زر الفحص بالصورة -->
    <div class="search-bar-wrap">
      <div class="search-pill glass">
        <button id="btnHomeSearch" class="search-icon-right" title="بحث" aria-label="بحث">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7.5"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
        </button>
        <input 
          type="text" 
          id="mainSearchInput" 
          class="search-input" 
          placeholder="ابحث باسم القطعة أو رقم الهيكل" 
          autocomplete="off"
        >
        <a href="image-search.html" class="search-scan-btn" title="البحث بالصورة" aria-label="البحث بالصورة">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </a>
      </div>
    </div>

    <!-- 3. كارت سيارة المطابقة -->
    <div class="vehicle-match-card glass glass-card-interactive" id="homeVehicleCard">
      <div class="vehicle-match-info">
        <div class="vehicle-icon-box">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/>
            <path d="M15 18H9"/>
            <path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/>
            <circle cx="17" cy="18.5" r="2.5"/>
            <circle cx="7" cy="18.5" r="2.5"/>
          </svg>
        </div>
        <div class="vehicle-text-col">
          <span class="vehicle-meta-label">سيارة المطابقة</span>
          <span class="vehicle-active-name">Toyota Camry 2025</span>
        </div>
      </div>
      <span class="vehicle-chevron">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </span>
    </div>

    <!-- 4. تصفح حسب الفئة - أيقونات بريميوم عصرية فائقة النقاء والتفاصيل -->
    <section>
      <div class="section-header">
        <h2 class="section-title">تصفح حسب الفئة</h2>
      </div>

      <div class="categories-grid-two-rows">
        <!-- الصف الأول: 3 عناصر -->
        <!-- 1. المحرك -->
        <a href="search.html?category=engine" class="category-item" title="قطع المحرك">
          <div class="category-tile-box-lg tile-engine">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <!-- كتلة المحرك التوربيني الدقيقة -->
              <path d="M4 8h16v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z"/>
              <path d="M2 11h2v4H2z"/>
              <path d="M20 11h2v4h-2z"/>
              <path d="M8 4v4"/>
              <path d="M12 4v4"/>
              <path d="M16 4v4"/>
              <circle cx="12" cy="14" r="2.5"/>
            </svg>
          </div>
          <span class="category-name-lg">المحرك</span>
        </a>

        <!-- 2. الفرامل -->
        <a href="search.html?category=brakes" class="category-item" title="الفرامل والفحمات">
          <div class="category-tile-box-lg tile-brakes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <!-- هوب فرامل مهوّى مع كليبر رياضي -->
              <circle cx="12" cy="12" r="9"/>
              <circle cx="12" cy="12" r="3.5"/>
              <path d="M6 12a6 6 0 0 1 6-6v3a3 3 0 0 0-3 3H6z"/>
              <line x1="12" y1="3" x2="12" y2="4.5"/>
              <line x1="12" y1="19.5" x2="12" y2="21"/>
              <line x1="3" y1="12" x2="4.5" y2="12"/>
              <line x1="19.5" y1="12" x2="21" y2="12"/>
            </svg>
          </div>
          <span class="category-name-lg">الفرامل</span>
        </a>

        <!-- 3. الكهرباء -->
        <a href="search.html?category=electrical" class="category-item" title="النظام الكهربائي والبطارية">
          <div class="category-tile-box-lg tile-electrical">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <!-- بطارية احترافية وأقطاب كهربائية -->
              <rect x="3" y="7" width="18" height="13" rx="2.5"/>
              <path d="M7 4v3"/>
              <path d="M17 4v3"/>
              <path d="M13 10.5l-3 4h4l-2 4"/>
            </svg>
          </div>
          <span class="category-name-lg">الكهرباء</span>
        </a>

        <!-- الصف الثاني: 3 عناصر -->
        <!-- 4. الزيوت والفلاتر -->
        <a href="search.html?category=oils" class="category-item" title="الزيوت وفلاتر الصيانة">
          <div class="category-tile-box-lg tile-oils">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <!-- عبوة زيت وفلتر انسيابي -->
              <path d="M12 2.5a4.5 4.5 0 0 1 4.5 4.5c0 3.5-4.5 8-4.5 8s-4.5-4.5-4.5-8A4.5 4.5 0 0 1 12 2.5z"/>
              <path d="M5 18h14v2.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20.5V18z"/>
              <line x1="9" y1="18" x2="9" y2="22"/>
              <line x1="15" y1="18" x2="15" y2="22"/>
            </svg>
          </div>
          <span class="category-name-lg">الزيوت والفلاتر</span>
        </a>

        <!-- 5. التعليق -->
        <a href="search.html?category=suspension" class="category-item" title="المساعدات ونظام التعليق">
          <div class="category-tile-box-lg tile-suspension">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <!-- مساعد رياضي وياي حلزوني دقيق -->
              <path d="M12 2v4"/>
              <path d="M8 6h8"/>
              <path d="m8 8 8 2-8 2 8 2-8 2 8 2-8 2"/>
              <path d="M8 20h8"/>
              <path d="M12 20v2.5"/>
            </svg>
          </div>
          <span class="category-name-lg">التعليق</span>
        </a>

        <!-- 6. الإضاءة -->
        <a href="search.html?category=lighting" class="category-item" title="الإنارة والشمعات">
          <div class="category-tile-box-lg tile-lighting">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <!-- شمعة إضاءة LED بروجكتر حديثة مع حزمة إشعاع -->
              <path d="M12 3a7 7 0 0 0-7 7c0 2.4 1.2 4.5 3 5.8V18a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.2c1.8-1.3 3-3.4 3-5.8a7 7 0 0 0-7-7z"/>
              <path d="M10 22h4"/>
              <line x1="12" y1="7" x2="12" y2="11"/>
            </svg>
          </div>
          <span class="category-name-lg">الإضاءة</span>
        </a>
      </div>
    </section>

    <!-- 5. قسم مختارة لك (مع ظهور زر عرض الكل كاملاً دون أن يغطيه الشريط) -->
    <section>
      <div class="section-header">
        <h2 class="section-title">مختارة لك</h2>
        <a href="search.html" class="section-link">
          <span>عرض الكل</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </a>
      </div>

      <div class="products-list" id="featuredProductsList">
        <!-- يتم ملؤها ديناميكياً بواسطة جافاسكريبت -->
      </div>
    </section>

  </div>

  <!-- سكربتات التطبيق -->
  <script src="assets/js/products.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 0. تحديث شارة نوع الحساب واسم المستخدم بالهيرو (بدون أي إيموجي)
      const updateHeroRole = () => {
        const role = KafuStore.getRoleData();
        const titleEl = document.getElementById('heroRoleTitle');
        if (titleEl) {
          titleEl.textContent = role.shortTitle || 'متجر قطع جديدة';
        }
        const userEl = document.getElementById('heroUserName');
        if (userEl) {
          userEl.textContent = role.name || 'محمد أحمد';
        }
      };
      updateHeroRole();
      window.addEventListener('kafu_store_update', (e) => {
        if (e.detail.key === 'role') updateHeroRole();
      });

      // 1. تثبيت شريط التنقل السفلي مع تحديد تبويب 'home'
      KafuApp.renderBottomNav('home');

      // 2. ربط كارت سيارة المطابقة
      const vehicleCard = document.getElementById('homeVehicleCard');
      KafuApp.bindVehicleCard(vehicleCard);

      // تحديث سطر الهيرو عند اختيار سيارة
      const updateHeroCar = () => {
        const car = KafuStore.getSelectedCar();
        const heroSub = document.getElementById('heroSubtitle');
        if (heroSub) {
          if (car && car.displayName) {
            heroSub.textContent = car.displayName;
          } else if (car && car.make) {
            heroSub.textContent = `${car.make} ${car.model} ${car.year}`;
          } else {
            heroSub.textContent = 'Toyota Camry 2025';
          }
        }
      };
      updateHeroCar();
      window.addEventListener('kafu_store_update', (e) => {
        if (e.detail.key === 'car') updateHeroCar();
      });

      // 3. بحث باسم القطعة أو برقم الهيكل
      const searchInput = document.getElementById('mainSearchInput');
      const homeLensBtn = document.getElementById('btnHomeSearch');
      const executeHomeSearch = () => {
        const val = searchInput.value.trim();
        window.location.href = val ? `search.html?q=${encodeURIComponent(val)}` : 'search.html';
      };
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') executeHomeSearch();
      });
      if (homeLensBtn) homeLensBtn.addEventListener('click', executeHomeSearch);

      // 4. عرض منتجات "مختارة لك"
      const container = document.getElementById('featuredProductsList');
      const renderProducts = () => {
        const car = KafuStore.getSelectedCar();
        container.innerHTML = PRODUCTS.slice(0, 4).map(p => {
          const comp = checkCompatibility(p, car);
          const compBadge = comp.status === 'compatible' 
            ? `<span style="font-size:0.74rem; color:#15803D; font-weight:700;">✓ متوافق مع سيارتك</span>` 
            : '';

          return `
            <div class="product-card glass glass-card-interactive" onclick="window.location.href='product.html?id=${p.id}'">
              <div class="product-img-box">
                <img src="${p.image}" alt="${p.name}" loading="lazy">
              </div>
              <div class="product-info-col">
                <div class="product-top-row">
                  <span class="product-brand">${p.brand}</span>
                  <span class="badge-available">متوفر</span>
                </div>
                <h3 class="product-title">${p.name}</h3>
                <div class="product-oem-row">
                  <span>رقم القطعة</span>
                  <span class="oem-code ltr">${p.oem}</span>
                </div>
                ${compBadge}
                <div class="product-bottom-row">
                  <span class="product-price">${KafuStore.formatPrice(p.price)}</span>
                  <button 
                    class="btn-add-cart-mini" 
                    title="أضف إلى السلة" 
                    aria-label="أضف إلى السلة"
                    onclick="event.stopPropagation(); KafuStore.addToCart(PRODUCTS.find(x => x.id === '${p.id}')); KafuApp.showToast('تمت إضافة ${p.name} للسلة ✓');"
                  >
                    ${KafuApp.ICONS.plus}
                  </button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      };

      renderProducts();
      window.addEventListener('kafu_store_update', (e) => {
        if (e.detail.key === 'car') renderProducts();
      });

      // أزرار الهيرو
      document.getElementById('btnNotifications')?.addEventListener('click', () => {
        KafuApp.showToast('لا توجد إشعارات جديدة حالياً');
      });
      document.getElementById('btnLanguage')?.addEventListener('click', () => {
        KafuApp.showToast('اللغة الحالية: العربية (السعودية)');
      });
    });
  </script>
</body>
</html>
