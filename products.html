<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>كفو | قطع الغيار الأصلية</title>
  <meta name="description" content="تصفح جميع قطع غيار السيارات الأصلية المتوافقة مع سيارتك بأفضل الأسعار المعتمدة.">

  <!-- الخط العربي الرسمي لكفو من Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/components.css">

  <style>
    :root {
      --app-font: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg, #F1F0F7);
      color: var(--text, #111418);
      font-family: var(--app-font);
      direction: rtl;
      text-align: right;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .products-page-container {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      padding-bottom: 90px;
    }

    @media (min-width: 768px) {
      .products-page-container {
        max-width: 900px;
      }
    }

    /* الهيدر العلوي بهوية كفو */
    .kafu-products-header {
      position: sticky;
      top: 0;
      z-index: 900;
      background: rgba(241, 240, 247, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 12px 14px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 16px rgba(10, 108, 255, 0.04);
    }

    .top-action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .btn-back-kafu {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: #FFFFFF;
      border: 1px solid rgba(226, 232, 240, 0.9);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      flex-shrink: 0;
    }

    .page-main-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #0F172A;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-cart-icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: #FFFFFF;
      border: 1px solid rgba(226, 232, 240, 0.9);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      flex-shrink: 0;
    }
    .header-cart-badge {
      position: absolute;
      top: -4px;
      left: -4px;
      background: var(--primary);
      color: #FFFFFF;
      font-size: 0.7rem;
      font-weight: 800;
      height: 18px;
      min-width: 18px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      border: 2px solid #FFFFFF;
    }

    /* شريط البحث المدمج بهوية كفو */
    .kafu-search-box {
      display: flex;
      align-items: center;
      background: #FFFFFF;
      border-radius: 16px;
      padding: 4px 6px 4px 12px;
      gap: 8px;
      border: 1.5px solid #E2E8F0;
      box-shadow: 0 2px 10px rgba(10, 108, 255, 0.04);
      transition: all 0.2s ease;
    }
    .kafu-search-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 4px 18px rgba(10, 108, 255, 0.12);
    }

    .kafu-search-input {
      flex: 1;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 0.88rem;
      color: var(--text);
      background: transparent;
      padding: 8px 0;
      min-width: 0;
    }

    .btn-camera-shortcut {
      background: var(--primary-light, #EBF2FF);
      color: var(--primary);
      border: none;
      border-radius: 12px;
      padding: 8px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn-camera-shortcut:hover {
      background: var(--primary);
      color: #FFFFFF;
    }

    /* شرائح التصنيفات السريعة */
    .chips-row {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 8px 0 2px;
    }
    .chips-row::-webkit-scrollbar {
      display: none;
    }

    .category-chip {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      color: #475569;
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .category-chip.active {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
      box-shadow: 0 3px 10px rgba(10, 108, 255, 0.25);
    }

    /* شبكة قطع الغيار (عمودين متوازنين بهوية كفو) */
    .spare-parts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 10px 14px;
    }

    @media (min-width: 768px) {
      .spare-parts-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
    }

    @media (min-width: 1024px) {
      .spare-parts-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    /* كارت القطعة */
    .part-card {
      background: #FFFFFF;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(226, 232, 240, 0.95);
      box-shadow: 0 3px 12px rgba(45, 52, 95, 0.04);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .part-card:active {
      transform: scale(0.98);
    }
    .part-card:hover {
      box-shadow: 0 8px 24px rgba(10, 108, 255, 0.1);
      border-color: rgba(10, 108, 255, 0.25);
    }

    /* وعاء صورة القطعة (صورة حقيقية لقطعة الغيار فقط) */
    .part-image-wrap {
      width: 100%;
      height: 148px;
      background: #F8FAFC;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #F1F5F9;
    }
    .part-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.25s ease;
    }
    .part-card:hover .part-image-wrap img {
      transform: scale(1.04);
    }

    .part-oem-tag {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      color: #FFFFFF;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.3px;
    }

    /* محتوى كارت القطعة */
    .part-body {
      padding: 10px 10px 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .part-brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .part-brand-text {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--primary);
    }
    .part-compat-pill {
      font-size: 0.66rem;
      font-weight: 700;
      color: #15803D;
      background: #DCFCE7;
      padding: 1px 6px;
      border-radius: 999px;
    }

    .part-name-title {
      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1.35;
      color: #0F172A;
      margin: 0 0 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 38px;
    }

    /* صف السعر المحدد الواحد وزر الإضافة */
    .part-price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid #F1F5F9;
    }

    .part-single-price {
      display: flex;
      align-items: baseline;
      gap: 3px;
    }
    .part-price-val {
      font-size: 1.15rem;
      font-weight: 800;
      color: #0F172A;
    }
    .part-price-curr {
      font-size: 0.74rem;
      font-weight: 700;
      color: #64748B;
    }

    /* زر إضافة سريع للسلة */
    .btn-add-part-mini {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--gradient-btn, linear-gradient(90deg, #0A6CFF 0%, #7B5CFF 100%));
      color: #FFFFFF;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(10, 108, 255, 0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      flex-shrink: 0;
    }
    .btn-add-part-mini:active {
      transform: scale(0.9);
    }
    .btn-add-part-mini:hover {
      box-shadow: 0 5px 14px rgba(10, 108, 255, 0.35);
    }
  </style>
</head>
<body>

  <!-- الدوائر الملونة الناعمة في الخلفية الخاصة بهوية كفو -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="products-page-container">

    <!-- =======================================================================
         الهيدر العلوي بهوية كفو الرسمية
         ======================================================================= -->
    <header class="kafu-products-header">
      
      <div class="top-action-bar">
        <a href="index.html" class="btn-back-kafu" title="الرجوع للرئيسية" aria-label="الرجوع للرئيسية">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </a>

        <h1 class="page-main-title">
          <span>قطع الغيار</span>
          <span style="font-size: 0.75rem; font-weight: 700; background: #DCFCE7; color: #15803D; padding: 2px 8px; border-radius: 999px;">أصلي 100%</span>
        </h1>

        <a href="cart.html" class="header-cart-icon-btn" title="سلة المشتريات" aria-label="سلة المشتريات">
          <span class="header-cart-badge" id="headerCartCount" style="display:none">0</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8" cy="21" r="1.25"/>
            <circle cx="19" cy="21" r="1.25"/>
            <path d="M2.05 2.05h2.4l2.5 12.2a2 2 0 0 0 1.96 1.6h9.8a2 2 0 0 0 1.96-1.6l1.5-7.4H5.2"/>
          </svg>
        </a>
      </div>

      <!-- حقل البحث الذكي مع زر الكاميرا -->
      <div class="kafu-search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>

        <input 
          type="search" 
          id="partsSearchInput" 
          class="kafu-search-input" 
          placeholder="ابحث باسم القطعة أو رقم الهيكل..." 
          oninput="handleSearchFilter(this.value)"
        >

        <a href="image-search.html" class="btn-camera-shortcut" title="البحث بتصوير القطعة" aria-label="تصوير القطعة">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </a>
      </div>

      <!-- شرائح تصفية الفئات -->
      <div class="chips-row">
        <button type="button" class="category-chip active" onclick="selectCategory('all', this)">الكل</button>
        <button type="button" class="category-chip" onclick="selectCategory('فرامل', this)">فرامل</button>
        <button type="button" class="category-chip" onclick="selectCategory('محرك', this)">محرك</button>
        <button type="button" class="category-chip" onclick="selectCategory('كهرباء', this)">كهرباء</button>
        <button type="button" class="category-chip" onclick="selectCategory('مساعدات', this)">مساعدات</button>
        <button type="button" class="category-chip" onclick="selectCategory('زيوت', this)">زيوت</button>
        <button type="button" class="category-chip" onclick="selectCategory('عوادم', this)">عوادم</button>
      </div>

    </header>

    <!-- =======================================================================
         شبكة كروت قطع الغيار (صور قطع غيار فقط + سعر واحد محدد)
         ======================================================================= -->
    <main class="spare-parts-grid" id="sparePartsGrid">
      <!-- يتم بناؤها ديناميكياً بواسطة جافاسكريبت -->
    </main>

  </div>

  <!-- سكربتات التطبيق الرسمية -->
  <script src="assets/js/store.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/alibaba-data.js"></script>
  <script src="assets/js/app.js"></script>

  <script>
    // =========================================================================
    // كود صفحة المنتجات الرسمية بهوية كفو
    // =========================================================================

    let activeCat = 'all';
    let searchQuery = '';

    function renderParts() {
      const grid = document.getElementById('sparePartsGrid');
      if (!grid) return;

      const filtered = KAFU_SPARE_PARTS.filter(p => {
        const matchCat = activeCat === 'all' || p.category === activeCat;
        const matchSearch = !searchQuery || 
          p.title.toLowerCase().includes(searchQuery) || 
          p.brand.toLowerCase().includes(searchQuery) ||
          p.oem.toLowerCase().includes(searchQuery);
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 48px 16px; color: #64748B;">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" stroke-width="1.8" style="margin-bottom: 10px;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <h3 style="font-size: 1.05rem; color: #0F172A; margin: 0 0 6px;">لا توجد قطع مطابقة للبحث</h3>
            <p style="font-size: 0.82rem; margin: 0;">جرب البحث بكلمات أخرى أو تصفح باقي الأقسام</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <article class="part-card" onclick="window.location.href='product.html?id=${p.id}'">
          
          <!-- صورة القطعة الأصلية فقط -->
          <div class="part-image-wrap">
            <img src="${p.image}" alt="${p.title}" loading="lazy" onerror="this.src='assets/images/welcome-parts.jpg'">
            <span class="part-oem-tag ltr">${p.oem}</span>
          </div>

          <div class="part-body">
            <div>
              <div class="part-brand-row">
                <span class="part-brand-text">${p.brand}</span>
                <span class="part-compat-pill">✓ متوافق</span>
              </div>
              <h3 class="part-name-title" title="${p.title}">${p.title}</h3>
            </div>

            <!-- سعر واحد محدد + زر إضافة للسلة -->
            <div class="part-price-row">
              <div class="part-single-price">
                <span class="part-price-val">${p.price}</span>
                <span class="part-price-curr">${p.currency}</span>
              </div>
              
              <button 
                type="button" 
                class="btn-add-part-mini" 
                title="إضافة للسلة" 
                aria-label="إضافة للسلة"
                onclick="event.stopPropagation(); addToCartDirect('${p.id}');"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
              </button>
            </div>
          </div>

        </article>
      `).join('');
    }

    function selectCategory(cat, el) {
      activeCat = cat;
      document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
      if (el) el.classList.add('active');
      renderParts();
    }

    function handleSearchFilter(val) {
      searchQuery = val.trim().toLowerCase();
      renderParts();
    }

    function addToCartDirect(partId) {
      const part = KAFU_SPARE_PARTS.find(x => x.id === partId);
      if (!part) return;

      KafuStore.addToCart({
        id: part.id,
        name: part.title,
        price: part.price,
        image: part.image,
        oem: part.oem,
        brand: part.brand
      });

      KafuApp.showToast(`تمت إضافة ${part.title.slice(0, 24)}... للسلة بنجاح ✓`);
      updateCartCount();
    }

    function updateCartCount() {
      const count = KafuStore.getCartCount();
      const badge = document.getElementById('headerCartCount');
      if (badge) {
        badge.textContent = count;
        badge.style.display = count > 0 ? 'flex' : 'none';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      // شريط التنقل السفلي بهوية كفو الرسمية
      KafuApp.renderBottomNav('search');

      renderParts();
      updateCartCount();

      window.addEventListener('kafu_store_update', (e) => {
        if (e.detail.key === 'cart') updateCartCount();
      });
    });
  </script>

</body>
</html>
