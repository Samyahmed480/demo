<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>كفو | اختيار نوع الحساب</title>
  <meta name="description" content="منظومة كفو الذكية لقطع غيار السيارات: اختيار حساب تاجر، مندوب مبيعات، مهندس ورشة، أو مندوب توصيل.">
  
  <!-- خطوط Google Fonts: IBM Plex Sans Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/tokens.css">

  <style>
    /* ==========================================================================
       واجهة كفو (Single Viewport / No Scroll Splash & Role Selection)
       تصميم مدمج 100vh متوافق مع كافة شاشات الجوال بدون تمرير نهائياً
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100vh;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      background: #F8FAFC;
      color: #0F172A;
      font-family: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* --------------------------------------------------------------------------
       1. الخلفية التقنية الهادئة (Automotive Engineering Watermark)
       -------------------------------------------------------------------------- */
    .bg-watermark-wrap {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .bg-watermark-svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bg-ambient-glow {
      position: fixed;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(10, 108, 255, 0.12) 0%, rgba(99, 102, 241, 0.05) 50%, transparent 70%);
      filter: blur(40px);
      z-index: 1;
      pointer-events: none;
    }

    /* --------------------------------------------------------------------------
       2. الحاوية المركزية للشاشة (Single Viewport Grid/Flex)
       -------------------------------------------------------------------------- */
    .welcome-screen-wrap {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      height: 100%;
      height: 100dvh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top, 14px)) 20px max(18px, env(safe-area-inset-bottom, 14px));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      animation: screenFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes screenFadeIn {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* --------------------------------------------------------------------------
       3. ترويسة الشعار والعنوان المدمجة (Header)
       -------------------------------------------------------------------------- */
    .splash-header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 4px;
    }

    .splash-logo-pod {
      position: relative;
      width: 74px;
      height: 74px;
      border-radius: 22px;
      background: linear-gradient(145deg, #FFFFFF, #F8FAFC);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 
        0 14px 28px -6px rgba(10, 108, 255, 0.22),
        0 2px 8px rgba(15, 23, 42, 0.04),
        0 0 0 1px rgba(226, 232, 240, 0.75) inset;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      transition: transform 0.3s ease;
    }

    .splash-logo-img {
      width: 56px;
      height: 56px;
      object-fit: contain;
      filter: drop-shadow(0 3px 6px rgba(15, 23, 42, 0.12));
    }

    .splash-app-title {
      font-size: 1.65rem;
      font-weight: 800;
      color: #0F172A;
      line-height: 1.15;
      margin-bottom: 3px;
      letter-spacing: -0.4px;
    }

    .splash-app-subtitle {
      font-size: 0.84rem;
      font-weight: 600;
      color: #0A6CFF;
      margin-bottom: 4px;
    }

    .splash-app-prompt {
      font-size: 0.78rem;
      color: #64748B;
      font-weight: 500;
    }

    /* --------------------------------------------------------------------------
       4. إطار وأزرار الأدوار البيضاوية الزرقاء الأنيقة (Oval Action Buttons)
       -------------------------------------------------------------------------- */
    .roles-card-frame {
      width: 100%;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      padding: 16px 14px;
      box-shadow: 
        0 18px 40px -10px rgba(15, 23, 42, 0.07),
        0 2px 8px rgba(15, 23, 42, 0.03);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* زر بيضاوي أزرق أنيق مثل أزرار الإجراءات في التطبيقات الحديثة */
    .btn-role-pill {
      width: 100%;
      height: 48px;
      border-radius: 9999px;
      background: linear-gradient(135deg, #0A6CFF 0%, #0054CE 100%);
      color: #FFFFFF;
      border: none;
      outline: none;
      font-family: inherit;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      box-shadow: 
        0 6px 18px -2px rgba(10, 108, 255, 0.32),
        inset 0 1px 1px rgba(255, 255, 255, 0.35);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-role-pill:hover {
      background: linear-gradient(135deg, #1A75FF 0%, #004FBE 100%);
      box-shadow: 
        0 8px 22px -2px rgba(10, 108, 255, 0.42),
        inset 0 1px 1px rgba(255, 255, 255, 0.45);
      transform: translateY(-1px);
    }

    .btn-role-pill:active {
      transform: scale(0.98);
      box-shadow: 0 3px 10px rgba(10, 108, 255, 0.25);
    }

    /* نص الدور في المنتصف تماماً بدون أي نصوص فرعية */
    .btn-role-label {
      font-size: 1.02rem;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.2px;
      text-align: center;
    }

    /* أيقونة جانبية ناعمة للدلالة (سهم أو قائمة) */
    .btn-role-indicator {
      position: absolute;
      left: 18px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .btn-role-pill:hover .btn-role-indicator {
      background: rgba(255, 255, 255, 0.24);
      transform: translateX(-2px);
    }

    /* --------------------------------------------------------------------------
       5. زر التصفح كعميل / زائر في أسفل الشاشة
       -------------------------------------------------------------------------- */
    .splash-footer {
      width: 100%;
      display: flex;
      justify-content: center;
      padding-top: 6px;
      margin-bottom: 2px;
    }

    .btn-visitor-pill {
      width: 100%;
      height: 44px;
      border-radius: 9999px;
      background: #FFFFFF;
      border: 1.5px solid #CBD5E1;
      color: #334155;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.04);
      transition: all 0.2s ease;
    }

    .btn-visitor-pill:hover {
      border-color: #0A6CFF;
      color: #0A6CFF;
      background: #EFF6FF;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(10, 108, 255, 0.12);
    }

    .btn-visitor-pill:active {
      transform: scale(0.98);
    }

    /* --------------------------------------------------------------------------
       6. نافذة الخيارات الفرعية السفلية (Modern Bottom Sheet Modal)
       تضمن بقاء الشاشة 100vh بدون أي Scroll وتفتح بسلاسة عند اختيار تاجر أو مندوب
       -------------------------------------------------------------------------- */
    .role-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 999;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .role-modal-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .role-modal-sheet {
      width: 100%;
      max-width: 420px;
      background: #FFFFFF;
      border-radius: 28px 28px 0 0;
      padding: 16px 20px max(24px, env(safe-area-inset-bottom, 20px));
      box-shadow: 0 -12px 36px rgba(15, 23, 42, 0.18);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }

    .role-modal-backdrop.open .role-modal-sheet {
      transform: translateY(0);
    }

    .modal-drag-pill {
      width: 38px;
      height: 4px;
      border-radius: 9999px;
      background: #CBD5E1;
      margin: 0 auto 4px;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #0F172A;
    }

    .modal-subtitle {
      font-size: 0.8rem;
      color: #64748B;
      font-weight: 500;
      margin-top: -6px;
      margin-bottom: 6px;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-subrole-pill {
      width: 100%;
      height: 48px;
      border-radius: 9999px;
      background: #EFF6FF;
      border: 1.5px solid #BFDBFE;
      color: #0A6CFF;
      font-family: inherit;
      font-size: 0.98rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-subrole-pill:hover {
      background: #0A6CFF;
      border-color: #0A6CFF;
      color: #FFFFFF;
      box-shadow: 0 6px 18px rgba(10, 108, 255, 0.28);
      transform: translateY(-1px);
    }

    .btn-subrole-pill:active {
      transform: scale(0.98);
    }

    .btn-modal-cancel {
      width: 100%;
      height: 42px;
      border-radius: 9999px;
      background: #F1F5F9;
      border: none;
      color: #64748B;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.2s ease;
    }

    .btn-modal-cancel:hover {
      background: #E2E8F0;
      color: #1E293B;
    }

    /* --------------------------------------------------------------------------
       7. شاشة التحميل والانتقال السريع
       -------------------------------------------------------------------------- */
    .role-loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .role-loading-overlay.active {
      display: flex;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid rgba(10, 108, 255, 0.15);
      border-top-color: #0A6CFF;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- 1. الخلفية التقنية الهندسية (Watermark Blueprint) لقطع غيار السيارات -->
  <div class="bg-watermark-wrap" aria-hidden="true">
    <svg class="bg-watermark-svg" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- ترس هندسي تقني بالأعلى يميناً -->
      <g opacity="0.04" stroke="#0A6CFF" stroke-width="1.8" transform="translate(560, 50)">
        <circle cx="100" cy="100" r="85" />
        <circle cx="100" cy="100" r="55" stroke-dasharray="6 4" />
        <circle cx="100" cy="100" r="28" />
        <line x1="100" y1="5" x2="100" y2="195" stroke-dasharray="4 4" />
        <line x1="5" y1="100" x2="195" y2="100" stroke-dasharray="4 4" />
      </g>

      <!-- مكبس محرك (Piston) وذراع توصيل بالأعلى يساراً -->
      <g opacity="0.04" stroke="#0F172A" stroke-width="1.8" transform="translate(50, 60)">
        <rect x="20" y="20" width="100" height="75" rx="6" />
        <line x1="28" y1="42" x2="112" y2="42" />
        <line x1="28" y1="60" x2="112" y2="60" />
        <path d="M70 95 L70 185" stroke-width="8" stroke-linecap="round" />
        <circle cx="70" cy="205" r="22" stroke-width="2.5" />
        <circle cx="70" cy="205" r="11" stroke-width="1.5" />
      </g>

      <!-- قرص فرامل مهوّى (Brake Disc Rotor) بالأسفل يساراً -->
      <g opacity="0.04" stroke="#0A6CFF" stroke-width="1.8" transform="translate(40, 520)">
        <circle cx="100" cy="100" r="90" />
        <circle cx="100" cy="100" r="80" />
        <circle cx="100" cy="100" r="42" />
        <circle cx="78" cy="78" r="4" />
        <circle cx="122" cy="78" r="4" />
        <circle cx="122" cy="122" r="4" />
        <circle cx="78" cy="122" r="4" />
        <path d="M150 40 Q185 85 180 135 L165 130 Q170 90 140 50 Z" fill="#0A6CFF" fill-opacity="0.03" />
      </g>

      <!-- مساعد وياي تعليق (Suspension Shock Absorber) بالأسفل يميناً -->
      <g opacity="0.04" stroke="#0F172A" stroke-width="2" transform="translate(630, 500)">
        <path d="M40 20 L40 50 Q56 68 40 86 Q24 104 40 122 Q56 140 40 158 Q24 176 40 194 L40 230" />
        <rect x="32" y="10" width="16" height="12" rx="2" />
        <circle cx="40" cy="242" r="12" />
      </g>

      <!-- شبكة تخطيطية هندسية (CAD Grid lines) -->
      <g opacity="0.03" stroke="#0A6CFF" stroke-width="1">
        <path d="M400 40 L400 760 M40 400 L760 400" stroke-dasharray="6 8" />
        <circle cx="400" cy="400" r="160" stroke-dasharray="8 6" />
        <circle cx="400" cy="400" r="280" stroke-dasharray="10 8" />
      </g>
    </svg>
  </div>

  <div class="bg-ambient-glow" aria-hidden="true"></div>

  <!-- 2. الشاشة الواحدة الكاملة (Single Screen No Scroll) -->
  <main class="welcome-screen-wrap">

    <!-- 1. الشعار والعنوان والوصف المدمج بالأعلى -->
    <header class="splash-header">
      <div class="splash-logo-pod" title="شعار كفو">
        <img src="assets/images/kafu-logo.png" alt="شعار كفو" class="splash-logo-img">
      </div>
      <h1 class="splash-app-title">كفو</h1>
      <span class="splash-app-subtitle">منظومة قطع غيار السيارات الذكية</span>
      <p class="splash-app-prompt">اختر نوع حسابك للمتابعة</p>
    </header>

    <!-- 2. بطاقة الأزرار البيضاوية الزرقاء في المنتصف (بدون نصوص فرعية) -->
    <section class="roles-card-frame" aria-label="خيارات الحسابات">

      <!-- زر: تاجر -->
      <button type="button" class="btn-role-pill" onclick="openRoleModal('merchant')" aria-haspopup="dialog" title="حساب تاجر">
        <span class="btn-role-label">تاجر</span>
        <span class="btn-role-indicator">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </span>
      </button>

      <!-- زر: مندوب مبيعات -->
      <button type="button" class="btn-role-pill" onclick="openRoleModal('rep')" aria-haspopup="dialog" title="حساب مندوب مبيعات">
        <span class="btn-role-label">مندوب مبيعات</span>
        <span class="btn-role-indicator">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </span>
      </button>

      <!-- زر: مهندس ورشة (مسار مباشر) -->
      <button type="button" class="btn-role-pill" onclick="selectRoleAndEnter('workshop')" title="حساب مهندس ورشة">
        <span class="btn-role-label">مهندس ورشة</span>
        <span class="btn-role-indicator">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </span>
      </button>

      <!-- زر: مندوب توصيل (مسار مباشر) -->
      <button type="button" class="btn-role-pill" onclick="selectRoleAndEnter('courier')" title="حساب مندوب توصيل">
        <span class="btn-role-label">مندوب توصيل</span>
        <span class="btn-role-indicator">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </span>
      </button>

    </section>

    <!-- 3. زر تصفح كعميل / زائر في الأسفل ظاهر بالكامل -->
    <footer class="splash-footer">
      <button type="button" class="btn-visitor-pill" onclick="selectRoleAndEnter('customer')" title="تصفح المتجر كعميل أو زائر">
        <span>تصفح كعميل / زائر</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
    </footer>

  </main>

  <!-- نافذة الخيارات الفرعية السفلية (Bottom Sheet Modal) لـ تاجر -->
  <div class="role-modal-backdrop" id="modalMerchant" onclick="closeModalsOnBackdrop(event, 'modalMerchant')" role="dialog" aria-modal="true">
    <div class="role-modal-sheet">
      <div class="modal-drag-pill"></div>
      <h3 class="modal-title">اختر تخصص التاجر</h3>
      <p class="modal-subtitle">حدد نوع المتجر للمتابعة إلى لوحة التحكم</p>
      <div class="modal-actions">
        <button type="button" class="btn-subrole-pill" onclick="selectRoleAndEnter('merchant_new')">
          تاجر قطع غيار جديدة
        </button>
        <button type="button" class="btn-subrole-pill" onclick="selectRoleAndEnter('merchant_scrap')">
          تاجر تشاليح
        </button>
        <button type="button" class="btn-modal-cancel" onclick="closeRoleModal('modalMerchant')">
          إلغاء
        </button>
      </div>
    </div>
  </div>

  <!-- نافذة الخيارات الفرعية السفلية (Bottom Sheet Modal) لـ مندوب مبيعات -->
  <div class="role-modal-backdrop" id="modalRep" onclick="closeModalsOnBackdrop(event, 'modalRep')" role="dialog" aria-modal="true">
    <div class="role-modal-sheet">
      <div class="modal-drag-pill"></div>
      <h3 class="modal-title">اختر تخصص مندوب المبيعات</h3>
      <p class="modal-subtitle">حدد نوع المهام للمتابعة إلى لوحة التحكم</p>
      <div class="modal-actions">
        <button type="button" class="btn-subrole-pill" onclick="selectRoleAndEnter('rep_oem')">
          مندوب مبيعات (جديد)
        </button>
        <button type="button" class="btn-subrole-pill" onclick="selectRoleAndEnter('rep_scrap')">
          مندوب مبيعات (تشاليح)
        </button>
        <button type="button" class="btn-modal-cancel" onclick="closeRoleModal('modalRep')">
          إلغاء
        </button>
      </div>
    </div>
  </div>

  <!-- شاشة التحميل والانتقال السريع -->
  <div class="role-loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <span style="font-size: 0.92rem; font-weight: 700; color: #1E293B;" id="loadingText">جاري تهيئة الواجهة...</span>
  </div>

  <!-- السكربتات البرمجية -->
  <script src="assets/js/products.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    // فتح نافذة الخيارات الفرعية السفلية
    function openRoleModal(type) {
      const modalId = type === 'merchant' ? 'modalMerchant' : 'modalRep';
      const modal = document.getElementById(modalId);
      if (modal) {
        modal.classList.add('open');
      }
    }

    // إغلاق النافذة الفرعية
    function closeRoleModal(modalId) {
      const modal = document.getElementById(modalId);
      if (modal) {
        modal.classList.remove('open');
      }
    }

    // إغلاق عند النقر على الخلفية
    function closeModalsOnBackdrop(e, modalId) {
      if (e.target.id === modalId) {
        closeRoleModal(modalId);
      }
    }

    // اختيار الدور والانتقال الفوري للواجهة
    function selectRoleAndEnter(roleId) {
      // إغلاق أي نافذة مفتوحة
      closeRoleModal('modalMerchant');
      closeRoleModal('modalRep');

      const overlay = document.getElementById('loadingOverlay');
      const text = document.getElementById('loadingText');
      
      const roleTitles = {
        merchant_new: 'تاجر قطع جديدة',
        merchant_scrap: 'تاجر تشاليح',
        rep_oem: 'مندوب مبيعات (جديد)',
        rep_scrap: 'مندوب مبيعات (تشاليح)',
        workshop: 'مهندس ورشة',
        courier: 'مندوب توصيل',
        customer: 'عميل عادي'
      };

      if (overlay && text) {
        text.textContent = `جاري الانتقال: ${roleTitles[roleId] || ''}...`;
        overlay.classList.add('active');
      }

      // حفظ الدور في المتجر والجلسة
      KafuStore.setRole(roleId);
      sessionStorage.setItem('kafu_splash_passed', 'true');

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 300);
    }
  </script>
</body>
</html>
