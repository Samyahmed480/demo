<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>كفو | مرحباً بك - اختيار الدور</title>
  <meta name="description" content="منظومة كفو الذكية لقطع غيار السيارات: اختيار حساب تاجر، مندوب مبيعات، مهندس ورشة، أو مندوب توصيل.">
  
  <!-- خطوط Google Fonts: IBM Plex Sans Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/tokens.css">

  <style>
    /* ==========================================================================
       واجهة كفو للهواتف الذكية (Mobile-First Splash & Role Selection)
       مضبوطة بالمللي لكافة شاشات الجوال وهواتف الآيفون والأندرويد
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html {
      width: 100%;
      height: 100%;
      height: 100dvh;
    }

    body {
      width: 100%;
      min-height: 100%;
      min-height: 100dvh;
      background: #F8FAFC;
      color: #0F172A;
      font-family: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* إخفاء شريط التمرير لمظهر يشبه التطبيقات الأصلية */
    body::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    body {
      scrollbar-width: none;
    }

    /* --------------------------------------------------------------------------
       1. الخلفية التقنية الهندسية (Automotive Blueprint Watermark)
       -------------------------------------------------------------------------- */
    .bg-watermark-wrap {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .bg-watermark-svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bg-ambient-glow {
      position: fixed;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, rgba(10, 108, 255, 0.14) 0%, rgba(99, 102, 241, 0.06) 50%, transparent 70%);
      filter: blur(45px);
      z-index: 1;
      pointer-events: none;
    }

    /* --------------------------------------------------------------------------
       2. الحاوية المركزية للشاشة المحسّنة للجوال (Mobile Container)
       -------------------------------------------------------------------------- */
    .welcome-screen-wrap {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 414px;
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top, 14px)) 16px max(24px, env(safe-area-inset-bottom, 20px));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      animation: screenFadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes screenFadeIn {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* --------------------------------------------------------------------------
       3. الشعار الرسمي والعنوان (Mobile Header)
       -------------------------------------------------------------------------- */
    .splash-header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 2px;
    }

    .splash-logo-pod {
      position: relative;
      width: clamp(66px, 16vw, 78px);
      height: clamp(66px, 16vw, 78px);
      border-radius: 24px;
      background: linear-gradient(145deg, #FFFFFF, #F8FAFC);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: 
        0 14px 28px -6px rgba(10, 108, 255, 0.22),
        0 2px 8px rgba(15, 23, 42, 0.04),
        0 0 0 1px rgba(226, 232, 240, 0.75) inset;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      transition: transform 0.3s ease;
    }

    .splash-logo-img {
      width: clamp(50px, 12vw, 60px);
      height: clamp(50px, 12vw, 60px);
      object-fit: contain;
      filter: drop-shadow(0 3px 6px rgba(15, 23, 42, 0.12));
    }

    .splash-app-title {
      font-size: clamp(1.45rem, 5vw, 1.7rem);
      font-weight: 800;
      color: #0F172A;
      line-height: 1.15;
      margin-bottom: 2px;
      letter-spacing: -0.4px;
    }

    .splash-app-subtitle {
      font-size: clamp(0.78rem, 2.8vw, 0.85rem);
      font-weight: 600;
      color: #0A6CFF;
      margin-bottom: 2px;
    }

    .splash-app-prompt {
      font-size: clamp(0.74rem, 2.5vw, 0.8rem);
      color: #64748B;
      font-weight: 500;
    }

    /* --------------------------------------------------------------------------
       4. بطاقة الأدوار الأصلية المحسّنة (Touch-Optimized Role Card)
       -------------------------------------------------------------------------- */
    .roles-card-frame {
      width: 100%;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 26px;
      padding: clamp(10px, 3vw, 14px);
      box-shadow: 
        0 18px 40px -10px rgba(15, 23, 42, 0.07),
        0 2px 8px rgba(15, 23, 42, 0.03);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* عنصر الدور (Button Card) */
    .role-acc-item {
      border-radius: 16px;
      background: #FFFFFF;
      border: 1.5px solid #E2E8F0;
      overflow: hidden;
      transition: border-color 0.22s ease, box-shadow 0.22s ease, transform 0.18s ease;
      -webkit-user-select: none;
      user-select: none;
    }

    .role-acc-item:hover {
      border-color: #CBD5E1;
    }

    .role-acc-item:active {
      transform: scale(0.985);
    }

    .role-acc-item.expanded {
      border-color: #0A6CFF;
      box-shadow: 0 6px 20px rgba(10, 108, 255, 0.12);
      background: #FBFDFF;
    }

    /* الزر الرئيسي لكل دور */
    .role-main-btn {
      width: 100%;
      height: clamp(52px, 12vw, 56px);
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: transparent;
      border: none;
      font-family: inherit;
      color: #0F172A;
      cursor: pointer;
      text-decoration: none;
      text-align: right;
      transition: background 0.18s ease;
    }

    .role-main-btn:active {
      background: rgba(10, 108, 255, 0.05);
    }

    .role-btn-start {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    /* صناديق الأيقونات المميزة لكل دور */
    .role-icon-box {
      width: clamp(36px, 9vw, 40px);
      height: clamp(36px, 9vw, 40px);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.22s ease;
    }

    .icon-merchant {
      background: #EFF6FF;
      color: #0A6CFF;
    }
    .icon-rep {
      background: #F5F3FF;
      color: #7C3AED;
    }
    .icon-workshop {
      background: #FFFBEB;
      color: #D97706;
    }
    .icon-courier {
      background: #ECFDF5;
      color: #059669;
    }

    .role-acc-item.expanded .role-icon-box {
      transform: scale(1.05);
    }

    .role-title-text {
      font-size: clamp(0.96rem, 3.2vw, 1.05rem);
      font-weight: 700;
      color: #0F172A;
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    /* سهم التوسيع أو الانتقال الدائري المحسن */
    .role-chevron-box, .role-arrow-box {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94A3B8;
      flex-shrink: 0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .role-acc-item.expanded .role-chevron-box {
      transform: rotate(180deg);
      background: #0A6CFF;
      border-color: #0A6CFF;
      color: #FFFFFF;
    }

    .role-acc-item:hover .role-arrow-box {
      background: #0A6CFF;
      border-color: #0A6CFF;
      color: #FFFFFF;
      transform: translateX(-3px);
    }

    /* --------------------------------------------------------------------------
       5. القوائم والخيارات الفرعية المنسابة بسلاسة (Smooth Accordion Sub-menu)
       -------------------------------------------------------------------------- */
    .role-sub-menu {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease, padding 0.25s ease;
      background: #F8FAFC;
      border-top: 1px solid transparent;
      padding: 0 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .role-acc-item.expanded .role-sub-menu {
      max-height: 140px;
      opacity: 1;
      padding: 8px 10px 10px;
      border-top-color: #E2E8F0;
    }

    .role-sub-btn {
      width: 100%;
      height: clamp(42px, 10vw, 46px);
      padding: 0 14px;
      border-radius: 12px;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.18s ease;
      text-decoration: none;
      text-align: right;
    }

    .role-sub-btn:hover, .role-sub-btn:active {
      border-color: #0A6CFF;
      background: #EFF6FF;
      transform: translateX(-2px);
    }

    .sub-btn-title {
      font-size: clamp(0.86rem, 2.9vw, 0.92rem);
      font-weight: 700;
      color: #1E293B;
      transition: color 0.18s ease;
    }

    .role-sub-btn:hover .sub-btn-title,
    .role-sub-btn:active .sub-btn-title {
      color: #0A6CFF;
    }

    .sub-btn-arrow {
      color: #94A3B8;
      display: flex;
      align-items: center;
      transition: color 0.18s ease, transform 0.18s ease;
    }

    .role-sub-btn:hover .sub-btn-arrow,
    .role-sub-btn:active .sub-btn-arrow {
      color: #0A6CFF;
      transform: translateX(-2px);
    }

    /* --------------------------------------------------------------------------
       6. زر التصفح كعميل / زائر بالأسفل
       -------------------------------------------------------------------------- */
    .splash-footer {
      width: 100%;
      display: flex;
      justify-content: center;
      padding-top: 4px;
      margin-bottom: 2px;
    }

    .btn-visitor-pill {
      width: 100%;
      max-width: 330px;
      height: clamp(44px, 11vw, 48px);
      border-radius: 9999px;
      background: #FFFFFF;
      border: 1.5px solid #CBD5E1;
      color: #334155;
      font-family: inherit;
      font-size: clamp(0.86rem, 2.9vw, 0.92rem);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      transition: all 0.2s ease;
      -webkit-user-select: none;
      user-select: none;
    }

    .btn-visitor-pill:hover,
    .btn-visitor-pill:active {
      border-color: #0A6CFF;
      color: #0A6CFF;
      background: #EFF6FF;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(10, 108, 255, 0.14);
    }

    /* --------------------------------------------------------------------------
       7. شاشة التحميل والانتقال السريع
       -------------------------------------------------------------------------- */
    .role-loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .role-loading-overlay.active {
      display: flex;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid rgba(10, 108, 255, 0.15);
      border-top-color: #0A6CFF;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ميديا كويري للهواتف ذات الشاشات القصيرة (iPhone SE / Small Androids) */
    @media (max-height: 680px) {
      .welcome-screen-wrap {
        padding-top: max(10px, env(safe-area-inset-top, 8px));
        padding-bottom: max(12px, env(safe-area-inset-bottom, 10px));
        gap: 8px;
      }
      .splash-logo-pod {
        width: 58px;
        height: 58px;
        border-radius: 18px;
        margin-bottom: 4px;
      }
      .splash-logo-img {
        width: 44px;
        height: 44px;
      }
      .splash-app-title {
        font-size: 1.35rem;
      }
      .roles-card-frame {
        padding: 8px;
        gap: 6px;
      }
      .role-main-btn {
        height: 48px;
      }
      .btn-visitor-pill {
        height: 42px;
      }
    }
  </style>
</head>
<body>

  <!-- 1. الخلفية التقنية الهندسية (Automotive Blueprint Watermark) -->
  <div class="bg-watermark-wrap" aria-hidden="true">
    <svg class="bg-watermark-svg" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- ترس ميكانيكي بالأعلى يميناً -->
      <g opacity="0.04" stroke="#0A6CFF" stroke-width="1.8" transform="translate(560, 50)">
        <circle cx="100" cy="100" r="85" />
        <circle cx="100" cy="100" r="55" stroke-dasharray="6 4" />
        <circle cx="100" cy="100" r="28" />
        <line x1="100" y1="5" x2="100" y2="195" stroke-dasharray="4 4" />
        <line x1="5" y1="100" x2="195" y2="100" stroke-dasharray="4 4" />
      </g>

      <!-- مكبس محرك Piston بالأعلى يساراً -->
      <g opacity="0.04" stroke="#0F172A" stroke-width="1.8" transform="translate(50, 60)">
        <rect x="20" y="20" width="100" height="75" rx="6" />
        <line x1="28" y1="42" x2="112" y2="42" />
        <line x1="28" y1="60" x2="112" y2="60" />
        <path d="M70 95 L70 185" stroke-width="8" stroke-linecap="round" />
        <circle cx="70" cy="205" r="22" stroke-width="2.5" />
        <circle cx="70" cy="205" r="11" stroke-width="1.5" />
      </g>

      <!-- قرص فرامل مهوّى Brake Disc بالأسفل يساراً -->
      <g opacity="0.04" stroke="#0A6CFF" stroke-width="1.8" transform="translate(40, 520)">
        <circle cx="100" cy="100" r="90" />
        <circle cx="100" cy="100" r="80" />
        <circle cx="100" cy="100" r="42" />
        <circle cx="78" cy="78" r="4" />
        <circle cx="122" cy="78" r="4" />
        <circle cx="122" cy="122" r="4" />
        <circle cx="78" cy="122" r="4" />
        <path d="M150 40 Q185 85 180 135 L165 130 Q170 90 140 50 Z" fill="#0A6CFF" fill-opacity="0.03" />
      </g>

      <!-- مساعد وياي تعليق Shock Absorber بالأسفل يميناً -->
      <g opacity="0.04" stroke="#0F172A" stroke-width="2" transform="translate(630, 500)">
        <path d="M40 20 L40 50 Q56 68 40 86 Q24 104 40 122 Q56 140 40 158 Q24 176 40 194 L40 230" />
        <rect x="32" y="10" width="16" height="12" rx="2" />
        <circle cx="40" cy="242" r="12" />
      </g>

      <!-- خطوط شبكية هندسية CAD Lines -->
      <g opacity="0.03" stroke="#0A6CFF" stroke-width="1">
        <path d="M400 40 L400 760 M40 400 L760 400" stroke-dasharray="6 8" />
        <circle cx="400" cy="400" r="160" stroke-dasharray="8 6" />
        <circle cx="400" cy="400" r="280" stroke-dasharray="10 8" />
      </g>
    </svg>
  </div>

  <div class="bg-ambient-glow" aria-hidden="true"></div>

  <!-- 2. الحاوية المركزية للشاشة المحسنة للجوال -->
  <main class="welcome-screen-wrap">

    <!-- 1. الشعار الرسمي والعنوان بالأعلى -->
    <header class="splash-header">
      <div class="splash-logo-pod" title="شعار كفو">
        <img src="assets/images/kafu-logo.png" alt="شعار كفو" class="splash-logo-img">
      </div>
      <h1 class="splash-app-title">كفو</h1>
      <span class="splash-app-subtitle">منظومة قطع غيار السيارات الذكية</span>
      <p class="splash-app-prompt">اختر نوع حسابك للمتابعة</p>
    </header>

    <!-- 2. بطاقة الأزرار الأصلية المحسّنة (بأيقوناتها المميزة وسهم التوسيع) -->
    <section class="roles-card-frame" aria-label="خيارات الحسابات">

      <!-- زر: تاجر (يفتح اختيارين فرعيين) -->
      <div class="role-acc-item" id="accMerchant">
        <button type="button" class="role-main-btn" onclick="toggleRoleAccordion('accMerchant')" aria-expanded="false" aria-controls="subMerchant">
          <div class="role-btn-start">
            <div class="role-icon-box icon-merchant">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
            </div>
            <span class="role-title-text">تاجر</span>
          </div>
          <div class="role-chevron-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </button>
        <!-- القائمة الفرعية لـ تاجر -->
        <div class="role-sub-menu" id="subMerchant">
          <button type="button" class="role-sub-btn" onclick="selectRoleAndEnter('merchant_new')">
            <span class="sub-btn-title">تاجر قطع غيار جديدة</span>
            <span class="sub-btn-arrow">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </span>
          </button>
          <button type="button" class="role-sub-btn" onclick="selectRoleAndEnter('merchant_scrap')">
            <span class="sub-btn-title">تاجر تشاليح</span>
            <span class="sub-btn-arrow">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </span>
          </button>
        </div>
      </div>

      <!-- زر: مندوب مبيعات (يفتح اختيارين فرعيين) -->
      <div class="role-acc-item" id="accRep">
        <button type="button" class="role-main-btn" onclick="toggleRoleAccordion('accRep')" aria-expanded="false" aria-controls="subRep">
          <div class="role-btn-start">
            <div class="role-icon-box icon-rep">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
              </svg>
            </div>
            <span class="role-title-text">مندوب مبيعات</span>
          </div>
          <div class="role-chevron-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </button>
        <!-- القائمة الفرعية لـ مندوب مبيعات -->
        <div class="role-sub-menu" id="subRep">
          <button type="button" class="role-sub-btn" onclick="selectRoleAndEnter('rep_oem')">
            <span class="sub-btn-title">مندوب مبيعات (جديد)</span>
            <span class="sub-btn-arrow">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </span>
          </button>
          <button type="button" class="role-sub-btn" onclick="selectRoleAndEnter('rep_scrap')">
            <span class="sub-btn-title">مندوب مبيعات (تشاليح)</span>
            <span class="sub-btn-arrow">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </span>
          </button>
        </div>
      </div>

      <!-- زر: مهندس ورشة (مسار مباشر) -->
      <div class="role-acc-item">

              </svg>
            </div>
            <span class="role-title-text">مهندس ورشة</span>
          </div>
          <div class="role-arrow-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">

      <!-- زر: مندوب توصيل (مسار مباشر) -->

        <button type="button" class="role-main-btn" onclick="selectRoleAndEnter('courier')" title="حساب مندوب توصيل">

              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                <path d="M15 18H9"></path>

                <circle cx="17" cy="18.5" r="2.5"></circle>
                <circle cx="7" cy="18.5" r="2.5"></circle>

    <!-- 3. زر تصفح كعميل / زائر في الأسفل ظاهر بالكامل وبمسافة أمان كافية -->

      <button type="button" class="btn-visitor-pill" onclick="selectRoleAndEnter('customer')" title="تصفح المتجر كعميل أو زائر">

  <!-- شاشة التحميل والانتقال السريع -->
  <div class="role-loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <span style="font-size: 0.92rem; font-weight: 700; color: #1E293B;" id="loadingText">جاري تهيئة الواجهة...</span>
  </div>

  <!-- السكربتات البرمجية -->
  <script src="assets/js/products.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    // التحكم في فتح وإغلاق القوائم الفرعية بتأثير Accordion سلس
    function toggleRoleAccordion(id) {
      const item = document.getElementById(id);
      if (!item) return;
      const isExpanded = item.classList.contains('expanded');

      // إغلاق أي قائمة أخرى أولاً للحفاظ على الحجم المتناسق للشاشة
      document.querySelectorAll('.role-acc-item').forEach(el => {
        el.classList.remove('expanded');
        const btn = el.querySelector('.role-main-btn');
        if (btn) btn.setAttribute('aria-expanded', 'false');
      });

      // إذا لم تكن مفتوحة مسبقاً، نفتحها
      if (!isExpanded) {
        item.classList.add('expanded');
        const btn = item.querySelector('.role-main-btn');
        if (btn) btn.setAttribute('aria-expanded', 'true');
      }
    }

    // اختيار الدور والانتقال الفوري للواجهة
    function selectRoleAndEnter(roleId) {
      const overlay = document.getElementById('loadingOverlay');
      const text = document.getElementById('loadingText');
      
      const roleTitles = {
        merchant_new: 'تاجر قطع جديدة',
        merchant_scrap: 'تاجر تشاليح',
        rep_oem: 'مندوب مبيعات (جديد)',
        rep_scrap: 'مندوب مبيعات (تشاليح)',
        workshop: 'مهندس ورشة',
        courier: 'مندوب توصيل',
        customer: 'عميل عادي'
      };

      if (overlay && text) {
        text.textContent = `جاري الانتقال: ${roleTitles[roleId] || ''}...`;
        overlay.classList.add('active');
      }

      // حفظ الدور في المتجر والجلسة
      KafuStore.setRole(roleId);
      sessionStorage.setItem('kafu_splash_passed', 'true');

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 300);
    }
  </script>
</body>
