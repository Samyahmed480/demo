<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>كفو | مرحباً بك - اختيار الدور</title>
  <meta name="description" content="منظومة كفو الذكية لقطع غيار السيارات: منصة موحدة تربط تجار قطع الغيار والورش الهندسية ومناديب المبيعات والتوصيل.">
  
  <!-- خطوط Google Fonts: IBM Plex Sans Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/components.css">

  <style>
    /* ==========================================================================
       واجهة كفو الترحيبية واختيار الأدوار (Luxury Mobile Welcome Splash)
       تصميم عصري فخم - خالي تماماً من الإيموجي - مع الشعار الرسمي والوصف
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      background: #F8FAFC;
      color: #0F172A;
      font-family: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: max(32px, env(safe-area-inset-top, 24px)) 16px max(32px, env(safe-area-inset-bottom, 24px));
      position: relative;
      overflow-x: hidden;
      margin: 0;
    }

    /* تأثيرات التوهج والخلفية الأثيرية */
    .bg-aura-glow {
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(10, 108, 255, 0.18) 0%, rgba(99, 102, 241, 0.1) 45%, rgba(248, 250, 252, 0) 70%);
      filter: blur(40px);
      z-index: 1;
      pointer-events: none;
      animation: auraFloat 8s ease-in-out infinite alternate;
    }

    .bg-bottom-glow {
      position: fixed;
      bottom: -150px;
      right: -80px;
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, rgba(248, 250, 252, 0) 70%);
      filter: blur(50px);
      z-index: 1;
      pointer-events: none;
    }

    @keyframes auraFloat {
      0% { transform: translateX(-50%) translateY(0) scale(1); }
      100% { transform: translateX(-50%) translateY(24px) scale(1.08); }
    }

    /* الحاوية المركزية للشاشة */
    .welcome-screen-wrap {
      width: 100%;
      max-width: 430px;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 10;
      animation: splashEntrance 0.75s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes splashEntrance {
      0% {
        opacity: 0;
        transform: translateY(22px) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* --------------------------------------------------------------------------
       1. منطقة الشعار الرسمي والعنوان والوصف الفخم
       -------------------------------------------------------------------------- */
    .splash-logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 22px;
      text-align: center;
      width: 100%;
    }

    /* إطار الشعار الفاخر ثلاثي الأبعاد مع توهج ناعم */
    .splash-logo-outer {
      position: relative;
      margin-bottom: 16px;
    }

    .splash-logo-halo {
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(10, 108, 255, 0.35) 0%, rgba(37, 99, 235, 0.12) 55%, transparent 75%);
      filter: blur(12px);
      z-index: 0;
      animation: haloBreathe 3.6s ease-in-out infinite;
    }

    @keyframes haloBreathe {
      0%, 100% {
        transform: scale(0.95);
        opacity: 0.7;
      }
      50% {
        transform: scale(1.08);
        opacity: 1;
      }
    }

    .splash-logo-pod {
      position: relative;
      z-index: 2;
      width: 96px;
      height: 96px;
      border-radius: 28px;
      background: linear-gradient(145deg, #FFFFFF, #F1F5F9);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 
        0 20px 36px -10px rgba(10, 108, 255, 0.28),
        0 4px 16px rgba(15, 23, 42, 0.06),
        0 0 0 1px rgba(226, 232, 240, 0.8) inset;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .splash-logo-pod:hover {
      transform: translateY(-2px) scale(1.02);
    }

    .splash-logo-img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(15, 23, 42, 0.16));
    }

    .splash-app-title {
      font-size: 1.85rem;
      font-weight: 800;
      color: #0F172A;
      margin: 0 0 4px;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    .splash-app-tagline {
      font-size: 0.88rem;
      font-weight: 700;
      color: #0A6CFF;
      margin: 0 0 8px;
      letter-spacing: 0.1px;
    }

    .splash-app-desc {
      font-size: 0.84rem;
      line-height: 1.55;
      color: #64748B;
      margin: 0 0 16px;
      max-width: 340px;
      font-weight: 500;
    }

    .roles-prompt-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 20px;
      background: #EDF4FF;
      border: 1px solid rgba(10, 108, 255, 0.15);
      color: #0A6CFF;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .roles-prompt-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #0A6CFF;
      box-shadow: 0 0 8px #0A6CFF;
    }

    /* --------------------------------------------------------------------------
       2. بطاقة خيارات الأدوار (Roles Card Frame)
       -------------------------------------------------------------------------- */
    .roles-card-frame {
      width: 100%;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      padding: 16px;
      box-shadow: 
        0 24px 50px -12px rgba(15, 23, 42, 0.09),
        0 4px 16px rgba(15, 23, 42, 0.03);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* عنصر الدور الفردي */
    .role-acc-item {
      border-radius: 18px;
      background: #FFFFFF;
      border: 1.5px solid #E2E8F0;
      overflow: hidden;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .role-acc-item:hover {
      border-color: #CBD5E1;
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.05);
    }

    .role-acc-item.expanded {
      border-color: #0A6CFF;
      box-shadow: 0 10px 28px rgba(10, 108, 255, 0.12);
      background: #FBFDFF;
    }

    /* الزر الرئيسي لكل دور */
    .role-main-btn {
      width: 100%;
      min-height: 64px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: transparent;
      border: none;
      font-family: inherit;
      color: #0F172A;
      cursor: pointer;
      text-decoration: none;
      text-align: right;
      transition: background 0.2s ease;
    }

    .role-main-btn:active {
      background: rgba(10, 108, 255, 0.03);
    }

    .role-btn-start {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    /* صناديق أيقونات الأدوار المميزة */
    .role-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .icon-merchant {
      background: #EFF6FF;
      color: #0A6CFF;
    }
    .icon-rep {
      background: #F5F3FF;
      color: #7C3AED;
    }
    .icon-workshop {
      background: #FFFBEB;
      color: #D97706;
    }
    .icon-courier {
      background: #ECFDF5;
      color: #059669;
    }

    .role-acc-item.expanded .role-icon-box {
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(10, 108, 255, 0.18);
    }

    /* نصوص العنوان والوصف المصغر للدور */
    .role-texts {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .role-title-text {
      font-size: 1.02rem;
      font-weight: 700;
      color: #0F172A;
      letter-spacing: -0.2px;
      line-height: 1.25;
    }

    .role-sub-desc {
      font-size: 0.77rem;
      color: #64748B;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* مؤشر السهم والتوسيع */
    .role-chevron-box, .role-arrow-box {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94A3B8;
      flex-shrink: 0;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .role-acc-item.expanded .role-chevron-box {
      transform: rotate(180deg);
      background: #0A6CFF;
      border-color: #0A6CFF;
      color: #FFFFFF;
    }

    .role-acc-item:hover .role-arrow-box {
      background: #0A6CFF;
      border-color: #0A6CFF;
      color: #FFFFFF;
      transform: translateX(-3px);
    }

    /* --------------------------------------------------------------------------
       3. القوائم والخيارات الفرعية (Smooth Accordion Sub-options)
       -------------------------------------------------------------------------- */
    .role-sub-menu {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease, padding 0.3s ease;
      background: #F8FAFC;
      border-top: 1px solid transparent;
      padding: 0 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .role-acc-item.expanded .role-sub-menu {
      max-height: 190px;
      opacity: 1;
      padding: 10px 12px 14px;
      border-top-color: #E2E8F0;
    }

    .role-sub-btn {
      width: 100%;
      min-height: 52px;
      padding: 8px 14px;
      border-radius: 14px;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.22s ease;
      text-decoration: none;
      text-align: right;
    }

    .role-sub-btn:hover {
      border-color: #0A6CFF;
      background: #EFF6FF;
      transform: translateX(-2px);
    }

    .role-sub-btn:active {
      transform: scale(0.985);
    }

    .sub-btn-texts {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sub-btn-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: #1E293B;
      transition: color 0.2s ease;
    }

    .sub-btn-desc {
      font-size: 0.74rem;
      color: #64748B;
      font-weight: 500;
    }

    .role-sub-btn:hover .sub-btn-title {
      color: #0A6CFF;
    }

    .sub-indicator-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: #F1F5F9;
      color: #94A3B8;
      transition: all 0.2s ease;
    }

    .role-sub-btn:hover .sub-indicator-pill {
      background: #0A6CFF;
      color: #FFFFFF;
    }

    /* --------------------------------------------------------------------------
       4. رابط التصفح كعميل / زائر
       -------------------------------------------------------------------------- */
    .splash-footer-link {
      margin-top: 14px;
      font-size: 0.86rem;
      font-weight: 600;
      color: #475569;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 16px;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
      transition: all 0.2s ease;
      cursor: pointer;
      font-family: inherit;
    }

    .splash-footer-link:hover {
      color: #0A6CFF;
      border-color: #0A6CFF;
      background: #EFF6FF;
      transform: translateY(-1px);
    }

    .visitor-subtitle {
      font-size: 0.75rem;
      color: #94A3B8;
      font-weight: 500;
    }

    /* نافذة التحميل والانتقال السلس */
    .role-loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .role-loading-overlay.active {
      display: flex;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- تأثيرات الإضاءة والتوهج الأثيرية -->
  <div class="bg-aura-glow"></div>
  <div class="bg-bottom-glow"></div>

  <!-- الحاوية المركزية للواجهة الترحيبية -->
  <main class="welcome-screen-wrap">

    <!-- 1. الشعار الرسمي والعنوان والوصف الفخم -->
    <header class="splash-logo-container">
      <div class="splash-logo-outer">
        <div class="splash-logo-halo"></div>
        <div class="splash-logo-pod" title="شعار كفو">
          <img src="assets/images/kafu-logo.png" alt="شعار كفو الرسمي" class="splash-logo-img">
        </div>
      </div>

      <h1 class="splash-app-title">كفو</h1>
      <span class="splash-app-tagline">منظومة قطع غيار السيارات الذكية</span>
      <p class="splash-app-desc">منصة موحدة تربط تجار قطع الغيار، الورش الهندسية، ومناديب المبيعات والتوصيل لإدارة الطلبات والتوريد بأعلى كفاءة.</p>

      <div class="roles-prompt-badge">
        <span class="roles-prompt-dot"></span>
        <span>اختر نوع حسابك للمتابعة</span>
      </div>
    </header>

    <!-- 2. كارت هيكل الأزرار وخيارات الأدوار الرئيسية والفرعية -->
    <section class="roles-card-frame" aria-label="خيارات الأدوار">

      <!-- زر: تاجر (يفتح اختيارين فرعيين) -->
      <div class="role-acc-item" id="accMerchant">
        <button type="button" class="role-main-btn" onclick="toggleRoleAccordion('accMerchant')" aria-expanded="false" aria-controls="subMerchant">
          <div class="role-btn-start">
            <div class="role-icon-box icon-merchant">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
            </div>
            <div class="role-texts">
              <span class="role-title-text">تاجر</span>
              <span class="role-sub-desc">إدارة متجر ومخزون قطع الغيار</span>
            </div>
          </div>
          <div class="role-chevron-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </button>
        <!-- القائمة الفرعية لـ تاجر -->
        <div class="role-sub-menu" id="subMerchant">
          <button type="button" class="role-sub-btn" onclick="selectRoleAndEnter('merchant_new')">
            <div class="sub-btn-texts">
              <span class="sub-btn-title">تاجر قطع غيار جديدة</span>
              <span class="sub-btn-desc">مورد وموزع قطع أصلية ومعتمدة</span>
            </div>
            <div class="sub-indicator-pill">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </div>
          </button>
          <button type="button" class="role-sub-btn" onclick="selectRoleAndEnter('merchant_scrap')">
            <div class="sub-btn-texts">
              <span class="sub-btn-title">تاجر تشاليح</span>
              <span class="sub-btn-desc">تشاليح وقطع مستعملة مفحوصة</span>
            </div>
            <div class="sub-indicator-pill">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </div>
          </button>
        </div>
      </div>

      <!-- زر: مندوب مبيعات (يفتح اختيارين فرعيين) -->
      <div class="role-acc-item" id="accRep">
        <button type="button" class="role-main-btn" onclick="toggleRoleAccordion('accRep')" aria-expanded="false" aria-controls="subRep">
          <div class="role-btn-start">
            <div class="role-icon-box icon-rep">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
              </svg>
            </div>
            <div class="role-texts">
              <span class="role-title-text">مندوب مبيعات</span>
              <span class="role-sub-desc">تسويق وتنسيق طلبيات العملاء</span>
            </div>
          </div>
          <div class="role-chevron-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </button>
        <!-- القائمة الفرعية لـ مندوب مبيعات -->
        <div class="role-sub-menu" id="subRep">
          <button type="button" class="role-sub-btn" onclick="selectRoleAndEnter('rep_oem')">
            <div class="sub-btn-texts">
              <span class="sub-btn-title">مندوب مبيعات (جديد)</span>
              <span class="sub-btn-desc">متابعة طلبيات القطع الجديدة</span>
            </div>
            <div class="sub-indicator-pill">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </div>
          </button>
          <button type="button" class="role-sub-btn" onclick="selectRoleAndEnter('rep_scrap')">
            <div class="sub-btn-texts">
              <span class="sub-btn-title">مندوب مبيعات (تشاليح)</span>
              <span class="sub-btn-desc">متابعة وتوريد طلبيات التشاليح</span>
            </div>
            <div class="sub-indicator-pill">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </div>
          </button>
        </div>
      </div>

      <!-- زر: مهندس ورشة (دور مستقل ينقله للواجهة التالية مباشرة) -->
      <div class="role-acc-item">
        <button type="button" class="role-main-btn" onclick="selectRoleAndEnter('workshop')" title="الدخول كمهندس ورشة">
          <div class="role-btn-start">
            <div class="role-icon-box icon-workshop">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
              </svg>
            </div>
            <div class="role-texts">
              <span class="role-title-text">مهندس ورشة</span>
              <span class="role-sub-desc">طلب القطع وإدارة الصيانة والفحص</span>
            </div>
          </div>
          <div class="role-arrow-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </div>
        </button>
      </div>

      <!-- زر: مندوب توصيل (دور مستقل ينقله للواجهة التالية مباشرة) -->
      <div class="role-acc-item">
        <button type="button" class="role-main-btn" onclick="selectRoleAndEnter('courier')" title="الدخول كمندوب توصيل">
          <div class="role-btn-start">
            <div class="role-icon-box icon-courier">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"></path>
                <path d="M15 18H9"></path>
                <path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"></path>
                <circle cx="17" cy="18.5" r="2.5"></circle>
                <circle cx="7" cy="18.5" r="2.5"></circle>
              </svg>
            </div>
            <div class="role-texts">
              <span class="role-title-text">مندوب توصيل</span>
              <span class="role-sub-desc">استلام الشحنات وتوصيل الطلبيات</span>
            </div>
          </div>
          <div class="role-arrow-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>

        </button>
      </div>

    </section>

    <!-- 3. الرابط الهادئ للتصفح العادي كعميل / زائر -->
    <button type="button" class="splash-footer-link" onclick="selectRoleAndEnter('customer')">
      <span>تصفح كعميل / زائر</span>
      <span class="visitor-subtitle">(استعراض الكتالوج والطلب المباشر)</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

  </main>

  <!-- شاشة التحميل والانتقال السلس -->
  <div class="role-loading-overlay" id="loadingOverlay">
    <div style="width: 44px; height: 44px; border-radius: 50%; border: 3px solid rgba(10, 108, 255, 0.15); border-top-color: #0A6CFF; animation: spin 0.8s linear infinite;"></div>
    <span style="font-size: 0.92rem; font-weight: 700; color: #1E293B;" id="loadingText">جاري تهيئة الواجهة...</span>
  </div>

  <!-- سكربتات التطبيق -->
  <script src="assets/js/products.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    // التحكم في فتح وإغلاق القوائم الفرعية
    function toggleRoleAccordion(id) {
      const item = document.getElementById(id);
      const isExpanded = item.classList.contains('expanded');

      // إغلاق أي قائمة مفتوحة أخرى أولاً لانتقال نظيف
      document.querySelectorAll('.role-acc-item').forEach(el => {
        el.classList.remove('expanded');
        const btn = el.querySelector('.role-main-btn');
        if (btn) btn.setAttribute('aria-expanded', 'false');
      });

      // إذا لم تكن مفتوحة مسبقاً، نفتحها
      if (!isExpanded) {
        item.classList.add('expanded');
        const btn = item.querySelector('.role-main-btn');
        if (btn) btn.setAttribute('aria-expanded', 'true');
      }
    }

    // حفظ الدور والانتقال فوراً للواجهة الرئيسية
    function selectRoleAndEnter(roleId) {
      const overlay = document.getElementById('loadingOverlay');
      const text = document.getElementById('loadingText');
      
      const roleTitles = {
        merchant_new: 'تاجر قطع جديدة',
        merchant_scrap: 'تاجر تشاليح',
        rep_oem: 'مندوب مبيعات (جديد)',
        rep_scrap: 'مندوب مبيعات (تشاليح)',
        workshop: 'مهندس ورشة',
        courier: 'مندوب توصيل',
        customer: 'عميل عادي'
      };

      if (overlay && text) {
        text.textContent = `جاري الانتقال: ${roleTitles[roleId] || ''}...`;
        overlay.classList.add('active');
      }

      // حفظ الدور في KafuStore و LocalStorage
      KafuStore.setRole(roleId);
      sessionStorage.setItem('kafu_splash_passed', 'true');

      // انتقال سلس للواجهة التالية
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 350);
    }
  </script>
</body>
