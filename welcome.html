<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>كفو | منظومة قطع غيار السيارات الذكية</title>
  <meta name="description" content="منظومة كفو الذكية لقطع غيار السيارات: اختر نوع حسابك للمتابعة تاجر، مندوب مبيعات، مهندس ورشة، أو مندوب توصيل.">
  
  <!-- خطوط Google Fonts: IBM Plex Sans Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/tokens.css">

  <style>
    /* ==========================================================================
       واجهة كفو للترحيب واختيار الدور - هوية بصرية سعودية حديثة ومتكاملة
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    :root {
      --primary-blue: #0066FF;
      --primary-dark: #0047BA;
      --primary-navy: #0F2D6B;
      --primary-steel: #0284C7;
      --primary-cobalt: #2563EB;
      --primary-light: #EFF6FF;
      --slate-title: #0A2540;
      --slate-sub: #64748B;
      --card-border: rgba(226, 232, 240, 0.9);
    }

    html {
      width: 100%;
      height: 100%;
      min-height: 100%;
      background: #F3F7FC;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: none;
    }

    body {
      width: 100%;
      min-height: 100%;
      min-height: 100dvh;
      background: #F3F7FC;
      color: var(--slate-title);
      font-family: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      overflow-y: visible;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overscroll-behavior: none;
    }

    body::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    body {
      scrollbar-width: none;
    }

    /* --------------------------------------------------------------------------
       1. طبقات الخلفية الفنية: التموجات ومعالم المملكة السفلية
       -------------------------------------------------------------------------- */
    .bg-canvas-wrapper {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    /* تموج أزرق ملكي في الزاوية العلوية اليسرى */
    .top-wave-left {
      position: absolute;
      top: -45px;
      left: -55px;
      width: 250px;
      height: 230px;
      background: radial-gradient(circle at 25% 25%, #0062FF 0%, #1D4ED8 40%, rgba(37, 99, 235, 0.25) 75%, transparent 100%);
      filter: blur(2px);
      border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      opacity: 0.9;
    }

    /* تموج أزرق في الزاوية العلوية اليمنى */
    .top-wave-right {
      position: absolute;
      top: -65px;
      right: -45px;
      width: 210px;
      height: 190px;
      background: radial-gradient(circle at 75% 25%, #2563EB 0%, #3B82F6 45%, rgba(96, 165, 250, 0.2) 75%, transparent 100%);
      filter: blur(3px);
      border-radius: 60% 40% 30% 70% / 50% 60% 40% 50%;
      opacity: 0.85;
    }

    /* أفق معالم المملكة العربية السعودية (برج المملكة، برج الفيصلية، كافد، مجدول، إثراء والنخيل) */
    .saudi-skyline-svg {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 420px;
      height: 175px;
      color: #0066FF;
      opacity: 0.13;
      pointer-events: none;
      z-index: 1;
      filter: drop-shadow(0 2px 8px rgba(0, 102, 255, 0.05));
      mask-image: linear-gradient(to top, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.6) 65%, transparent 100%);
      -webkit-mask-image: linear-gradient(to top, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.6) 65%, transparent 100%);
    }

    /* تموج القاع الكحلي والأزرق الملكي */
    .bottom-ocean-wave {
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 42px;
      z-index: 2;
    }

    /* --------------------------------------------------------------------------
       2. الحاوية الرئيسية للشاشة المنسقة بالكامل مع الهواتف الذكية (Mobile Perfect)
       -------------------------------------------------------------------------- */
    .mobile-screen-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 390px; /* متوافقة بدقة 100% مع أبعاد Galaxy S24 و iPhone Pro */
      min-height: 100%;
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(12px, env(safe-area-inset-top, 12px)) 16px max(14px, env(safe-area-inset-bottom, 12px));
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    /* --------------------------------------------------------------------------
       3. شريط تغيير اللغة بالأعلى (مع أيقونة الترس)
       -------------------------------------------------------------------------- */
    .top-lang-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-bottom: 2px;
      min-height: 38px;
    }

    .lang-pill-btn {
      height: 36px;
      padding: 0 14px;
      border-radius: 9999px;
      background: #FFFFFF;
      border: 1px solid rgba(226, 232, 240, 0.95);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.84rem;
      font-weight: 700;
      color: #0A2540;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
      -webkit-user-select: none;
      user-select: none;
    }

    .lang-pill-btn:active {
      transform: scale(0.96);
      background: #F8FAFC;
    }

    .lang-gear-icon {
      color: #0066FF;
      transition: transform 0.4s ease;
      display: flex;
      align-items: center;
    }

    .lang-pill-btn:hover .lang-gear-icon {
      transform: rotate(45deg);
    }

    /* --------------------------------------------------------------------------
       4. رأس الصفحة: الشعار والعناوين والتروس الجانبية المتناسقة بدقة مع الهاتف
       -------------------------------------------------------------------------- */
    .welcome-header-card {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 4px;
      margin-bottom: 0;
      position: relative;
      z-index: 10;
      contain: layout style;
    }

    /* هالة إشعاعية ناصعة خلف الشعار لعزل النصوص والتروس */
    .central-glow {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translate3d(-50%, 0, 0);
      width: 270px;
      height: 200px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.98) 0%, rgba(240, 246, 255, 0.92) 55%, transparent 80%);
      filter: blur(12px);
      z-index: 1;
      pointer-events: none;
      backface-visibility: hidden;
    }

    /* الترس الميكانيكي المتحرك (جهة اليسار) - تسريع عتادي GPU ودوران فائق السلاسة بدون أي اهتزاز */
    .header-gear-asset {
      position: absolute;
      top: -4px;
      left: -12px;
      width: 108px;
      height: 108px;
      background-image: url('assets/images/welcome-gear.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      z-index: 2;
      transform: translate3d(0, 0, 0);
      will-change: transform;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      animation: gentleGearRotate 50s linear infinite;
      transform-origin: center center;
      opacity: 0.92;
      pointer-events: none;
    }

    @keyframes gentleGearRotate {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg);
      }
      100% {
        transform: translate3d(0, 0, 0) rotate(360deg);
      }
    }

    /* قطع الغيار والقرص الثابت (جهة اليمين) - أبعاد متناسقة بدقة ومحاذاة مثالية مع الشعار */
    .header-parts-asset {
      position: absolute;
      top: -4px;
      right: -10px;
      width: 106px;
      height: 106px;
      background-image: url('assets/images/welcome-parts.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      z-index: 2;
      opacity: 0.92;
      pointer-events: none;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* صندوق الشعار المستدير (Squircle Pod) */
    .brand-logo-pod {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      background: #FFFFFF;
      box-shadow: 
        0 12px 28px rgba(0, 102, 255, 0.16),
        0 3px 8px rgba(15, 23, 42, 0.04);
      border: 2px solid #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      position: relative;
      z-index: 3;
    }

    .brand-logo-icon {
      width: 50px;
      height: 50px;
      object-fit: contain;
    }

    .brand-title {
      font-size: 1.95rem;
      font-weight: 900;
      color: #0A2540;
      line-height: 1.15;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
      position: relative;
      z-index: 3;
    }

    /* حاوية العنوان الفرعي لضمان التمركز التام والعزل المستقل دون أي تداخل */
    .brand-subtitle-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 250px;
      margin: 2px auto 6px;
      position: relative;
      z-index: 3;
    }

    .brand-subtitle {
      font-size: 0.83rem;
      font-weight: 700;
      color: #0066FF;
      line-height: 1.25;
      text-align: center;
      letter-spacing: -0.2px;
      padding: 4px 14px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(0, 102, 255, 0.14);
      box-shadow: 0 2px 10px rgba(0, 102, 255, 0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      white-space: nowrap;
    }

    .brand-prompt {
      font-size: 0.81rem;
      font-weight: 500;
      color: #64748B;
      margin-top: 3px;
      position: relative;
      z-index: 3;
    }

    /* --------------------------------------------------------------------------
       5. قسم الإجراءات والبطاقات (فاصل رأسي واسع ومساحة تنفس مريحة)
       -------------------------------------------------------------------------- */
    .welcome-actions-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      /* زيادة الفاصل الرأسي لإنزال قائمة الأزرار واستغلال الفراغ بانسيابية */
      margin-top: clamp(26px, 5.2vh, 44px);
      margin-bottom: clamp(14px, 2.5vh, 22px);
      position: relative;
      z-index: 5;
    }

    .roles-list-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-bottom: 12px;
    }

    .role-action-card {
      width: 100%;
      height: 68px;
      border-radius: 18px;
      background: #FFFFFF;
      border: 1px solid var(--card-border);
      box-shadow: 
        0 4px 16px rgba(15, 23, 42, 0.04),
        0 1px 3px rgba(15, 23, 42, 0.02);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px 6px 14px;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
      color: inherit;
      text-align: right;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, border-color 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .role-action-card:hover {
      border-color: rgba(0, 102, 255, 0.35);
      box-shadow: 0 8px 24px rgba(0, 102, 255, 0.09);
      transform: translate3d(0, -2px, 0);
    }

    .role-action-card:active {
      transform: scale(0.985);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    /* المحتوى الأيمن: بادج الأيقونة المتدرجة + النصوص */
    .role-content-start {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    /* البادج المربع المتدرج للأيقونة - هوية كفو الزرقاء الموحدة والفاخرة */
    .role-gradient-badge {
      width: 52px;
      height: 52px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #FFFFFF;
      background: linear-gradient(135deg, #0066FF 0%, #0047BA 100%);
      box-shadow: 0 4px 14px rgba(0, 102, 255, 0.22);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;
      position: relative;
    }

    /* حلقة خفيفة تضفي طابعاً مستقبلياً فائق الأناقة */
    .role-gradient-badge::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      pointer-events: none;
    }

    .role-action-card:hover .role-gradient-badge {
      transform: scale(1.04);
      box-shadow: 0 6px 18px rgba(0, 102, 255, 0.32);
    }

    /* توحيد درجات الأزرق المعتمدة لهوية كفو لكافة الأدوار */
    /* 1. تاجر: كحلي ملكي راقي يعكس الثقة والمؤسسية */
    .badge-merchant {
      background: linear-gradient(135deg, #0052CC 0%, #003399 100%);
      box-shadow: 0 5px 16px rgba(0, 82, 204, 0.28);
    }

    /* 2. مندوب مبيعات: أزرق كفو الأساسي العصري والحيوي */
    .badge-rep {
      background: linear-gradient(135deg, #0066FF 0%, #0047BA 100%);
      box-shadow: 0 5px 16px rgba(0, 102, 255, 0.28);
    }

    /* 3. مهندس ورشة: أزرق سماوي تقني يرمز للدقة والهندسة */
    .badge-workshop {
      background: linear-gradient(135deg, #0284C7 0%, #0056B3 100%);
      box-shadow: 0 5px 16px rgba(2, 132, 199, 0.28);
    }

    /* 4. مندوب توصيل: أزرق كوبالت سريع يرمز للحركة واللوجستيات */
    .badge-courier {
      background: linear-gradient(135deg, #1D4ED8 0%, #0A3EA2 100%);
      box-shadow: 0 5px 16px rgba(29, 78, 216, 0.28);
    }

    /* نصوص العنوان والوصف */
    .role-texts-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 1px;
    }

    .role-card-name {
      font-size: 1.01rem;
      font-weight: 800;
      color: #0F172A;
      line-height: 1.25;
      letter-spacing: -0.2px;
    }

    .role-card-desc {
      font-size: 0.77rem;
      font-weight: 500;
      color: #64748B;
      line-height: 1.2;
    }

    /* دائرة السهم اليسرى المنسقة بتدرج هادئ */
    .role-chevron-circle {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #F0F6FF;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0066FF;
      flex-shrink: 0;
      transition: background 0.2s ease, transform 0.2s ease, color 0.2s ease;
    }

    .role-action-card:hover .role-chevron-circle {
      background: #0066FF;
      color: #FFFFFF;
      transform: translateX(-3px);
    }

    /* --------------------------------------------------------------------------
       6. زر الزائر / العميل البيضاوي (تصفح كعميل / زائر)
       -------------------------------------------------------------------------- */
    .visitor-btn-pill {
      width: 100%;
      height: 52px;
      border-radius: 9999px;
      background: #FFFFFF;
      border: 1.8px solid #0066FF;
      box-shadow: 0 4px 14px rgba(0, 102, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      font-family: inherit;
      color: #0066FF;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      margin-bottom: 0;
    }

    .visitor-btn-pill:hover {
      background: #F0F6FF;
      box-shadow: 0 6px 18px rgba(0, 102, 255, 0.14);
      transform: translateY(-1px);
    }

    .visitor-btn-pill:active {
      transform: scale(0.985);
    }

    .visitor-content-center {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .visitor-title-text {
      font-size: 0.94rem;
      font-weight: 700;
      color: #0066FF;
    }

    /* --------------------------------------------------------------------------
       7. تذييل الصفحة: عبارة "مع كفو ... كل قطعة في مكانها"
       -------------------------------------------------------------------------- */
    .welcome-footer-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: auto;
      padding-top: 8px;
      padding-bottom: max(12px, env(safe-area-inset-bottom, 12px));
      position: relative;
      z-index: 20;
    }

    .tagline-divider-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
    }

    .tagline-line {
      flex: 1;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, rgba(0, 102, 255, 0.35), transparent);
    }

    .tagline-label {
      font-size: 0.88rem;
      font-weight: 800;
      color: #0066FF;
      white-space: nowrap;
      letter-spacing: -0.2px;
      padding: 5px 16px;
      background: #EFF6FF;
      border: 1.2px solid rgba(0, 102, 255, 0.22);
      border-radius: 9999px;
      box-shadow: 0 2px 8px rgba(0, 102, 255, 0.08);
      display: inline-block;
    }

    /* عرض فائق الأناقة ومحكم لشاشات الديسكتوب */
    @media (min-width: 769px) {
      body:not(.in-mobile-frame) {
        background: #E8EEF5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 0;
      }

      body:not(.in-mobile-frame) .mobile-screen-container {
        max-width: 390px;
        height: 844px;
        min-height: 844px;
        max-height: 92vh;
        border-radius: 38px;
        box-shadow: 
          0 25px 60px -15px rgba(15, 23, 42, 0.22),
          0 0 0 1px rgba(226, 232, 240, 0.95),
          0 0 0 8px #0F172A;
        overflow-x: hidden;
        overflow-y: auto;
        background: #F3F7FC;
        position: relative;
      }

      body:not(.in-mobile-frame) .bg-canvas-wrapper {
        position: absolute;
        width: 390px;
        height: 844px;
        max-height: 92vh;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 38px;
        overflow: hidden;
      }
    }

    /* --------------------------------------------------------------------------
       9. النافذة المنبثقة التفاعلية لاختيار تخصص التاجر أو المندوب (Bottom Sheet)
       -------------------------------------------------------------------------- */
    .submodal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 999;
      display: none;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .submodal-backdrop.active {
      display: flex;
      opacity: 1;
    }

    .submodal-sheet {
      width: 100%;
      max-width: 390px;
      background: #FFFFFF;
      border-radius: 28px 28px 0 0;
      padding: 20px 20px 28px;
      box-shadow: 0 -10px 40px rgba(15, 23, 42, 0.16);
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .submodal-backdrop.active .submodal-sheet {
      transform: translateY(0);
    }

    .submodal-handle {
      width: 42px;
      height: 4px;
      border-radius: 99px;
      background: #CBD5E1;
      align-self: center;
      margin-bottom: 4px;
    }

    .submodal-header {
      text-align: center;
      margin-bottom: 4px;
    }

    .submodal-title {
      font-size: 1.12rem;
      font-weight: 800;
      color: #0F172A;
      margin-bottom: 3px;
    }

    .submodal-desc {
      font-size: 0.8rem;
      color: #64748B;
    }

    .submodal-options-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .submodal-opt-btn {
      width: 100%;
      padding: 13px 15px;
      border-radius: 15px;
      background: #F8FAFC;
      border: 1.5px solid #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-family: inherit;
      text-align: right;
      transition: all 0.18s ease;
    }

    .submodal-opt-btn:hover {
      background: #EFF6FF;
      border-color: #0066FF;
      transform: translateX(-3px);
    }

    .submodal-opt-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .submodal-opt-title {
      font-size: 0.94rem;
      font-weight: 700;
      color: #0F172A;
    }

    .submodal-opt-sub {
      font-size: 0.76rem;
      color: #64748B;
    }

    .submodal-cancel-btn {
      width: 100%;
      height: 44px;
      border-radius: 13px;
      background: #F1F5F9;
      border: none;
      color: #475569;
      font-size: 0.9rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 2px;
    }

    /* --------------------------------------------------------------------------
       10. نافذة تبديل اللغة (Language Selection Sheet)
       -------------------------------------------------------------------------- */
    .lang-sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .lang-sheet-backdrop.active {
      display: flex;
      opacity: 1;
    }

    .lang-sheet {
      width: 100%;
      max-width: 390px;
      background: #FFFFFF;
      border-radius: 28px 28px 0 0;
      padding: 20px 20px 28px;
      box-shadow: 0 -10px 40px rgba(15, 23, 42, 0.16);
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .lang-sheet-backdrop.active .lang-sheet {
      transform: translateY(0);
    }

    .lang-item-btn {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      background: #F8FAFC;
      border: 1.5px solid #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      color: #0F172A;
      transition: all 0.18s ease;
    }

    .lang-item-btn.selected {
      background: #EFF6FF;
      border-color: #0066FF;
      color: #0066FF;
    }

    /* --------------------------------------------------------------------------
       11. استجابة ذكية ومثالية للهواتف الذكية والشاشات الصغيرة (Responsive Mobile Fit)
       -------------------------------------------------------------------------- */
    @media (max-width: 370px) {
      .header-gear-asset {
        width: 96px;
        height: 96px;
        left: -10px;
        top: -4px;
      }
      .header-parts-asset {
        width: 94px;
        height: 94px;
        right: -8px;
        top: -2px;
      }
      .brand-subtitle-wrap {
        max-width: 236px;
      }
      .brand-subtitle {
        font-size: 0.78rem;
        padding: 3px 10px;
      }
    }

    @media (max-height: 760px) {
      .mobile-screen-container {
        padding-top: 8px;
        padding-bottom: 8px;
      }
      .header-gear-asset {
        width: 92px;
        height: 92px;
        top: -4px;
        left: -10px;
      }
      .header-parts-asset {
        width: 90px;
        height: 90px;
        top: -2px;
        right: -8px;
      }
      .brand-logo-pod {
        width: 66px;
        height: 66px;
        border-radius: 18px;
        margin-bottom: 4px;
      }
      .brand-logo-icon {
        width: 44px;
        height: 44px;
      }
      .brand-title {
        font-size: 1.7rem;
        margin-bottom: 2px;
      }
      .brand-subtitle {
        font-size: 0.78rem;
        margin-bottom: 2px;
        padding: 2px 10px;
      }
      .brand-prompt {
        font-size: 0.74rem;
      }
      .welcome-actions-section {
        margin-top: 16px;
        margin-bottom: 10px;
      }
      .roles-list-group {
        gap: 8px;
        margin-bottom: 8px;
      }
      .role-action-card {
        height: 60px;
        border-radius: 15px;
        padding: 5px 8px 5px 12px;
      }
      .role-gradient-badge {
        width: 46px;
        height: 46px;
        border-radius: 12px;
      }
      .role-card-name {
        font-size: 0.94rem;
      }
      .role-card-desc {
        font-size: 0.73rem;
      }
      .role-chevron-circle {
        width: 30px;
        height: 30px;
      }
      .visitor-btn-pill {
        height: 46px;
        margin-bottom: 0;
      }
      .tagline-label {
        font-size: 0.82rem;
        padding: 3px 12px;
      }
      .saudi-skyline-svg {
        height: 130px;
        opacity: 0.10;
      }
    }

    /* شاشات مدمجة جداً (مثل وضع محاكي الجوال 391x412 أو الشاشات الأفقية) */
    @media (max-height: 520px) {
      .mobile-screen-container {
        padding-top: 6px;
        padding-bottom: 6px;
      }
      .header-gear-asset {
        width: 78px;
        height: 78px;
        top: -2px;
        left: -6px;
      }
      .header-parts-asset {
        width: 76px;
        height: 76px;
        top: -2px;
        right: -6px;
      }
      .brand-logo-pod {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        margin-bottom: 2px;
      }
      .brand-logo-icon {
        width: 34px;
        height: 34px;
      }
      .brand-title {
        font-size: 1.42rem;
        margin-bottom: 2px;
      }
      .brand-subtitle-wrap {
        max-width: 220px;
        margin: 1px auto 3px;
      }
      .brand-subtitle {
        font-size: 0.72rem;
        padding: 2px 8px;
      }
      .brand-prompt {
        display: none;
      }
      .welcome-actions-section {
        margin-top: 10px;
        margin-bottom: 6px;
      }
      .roles-list-group {
        gap: 6px;
        margin-bottom: 6px;
      }
      .role-action-card {
        height: 50px;
        border-radius: 12px;
        padding: 4px 6px 4px 10px;
      }
      .role-gradient-badge {
        width: 38px;
        height: 38px;
        border-radius: 10px;
      }
      .role-gradient-badge svg {
        width: 20px;
        height: 20px;
      }
      .role-card-name {
        font-size: 0.88rem;
      }
      .role-card-desc {
        font-size: 0.68rem;
      }
      .visitor-btn-pill {
        height: 42px;
        font-size: 0.84rem;
      }
      .saudi-skyline-svg {
        height: 90px;
        opacity: 0.08;
      }
    }

    /* --------------------------------------------------------------------------
       12. شاشة التحميل والانتقال
       -------------------------------------------------------------------------- */
    .role-loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .role-loading-overlay.active {
      display: flex;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3.5px solid rgba(0, 102, 255, 0.15);
      border-top-color: #0066FF;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- =========================================================================

    </svg>

    <!-- تموج كحلي أنيق في قاعدة الشاشة -->
    <svg class="bottom-ocean-wave" viewBox="0 0 1440 120" fill="none" preserveAspectRatio="none">
      <path d="M0,40 C320,120 480,10 720,50 C960,90 1180,20 1440,60 L1440,120 L0,120 Z" fill="#0058DD"/>

  <!-- =========================================================================
       2. هيكل شاشة الجوال المركزية المنسقة
       ========================================================================= -->
  <main class="mobile-screen-container">

    <!-- شريط تغيير اللغة بالأعلى فقط (مع أيقونة الترس) -->
    <header class="top-lang-bar">
      <!-- زر تغيير اللغة البيضاوي (ترس ⚙️ + عربي ⌵) -->
      <button type="button" class="lang-pill-btn" title="تغيير لغة التطبيق" aria-label="تغيير لغة التطبيق" onclick="openLangSheet()">
        <span class="lang-gear-icon">
          <!-- أيقونة الترس الهندسي الدقيق -->
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </span>
        <span id="currentLangLabel">عربي</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
    </header>

    <!-- كتلة الهيدر والعنوان: التروس الجانبية مدمجة هنا ومطابقة لحجم وأبعاد الموبايل تماماً -->
    <section class="welcome-header-card">
      <!-- هالة بيضاء ناصعة بالمركز لعزل النصوص -->
      <div class="central-glow" aria-hidden="true"></div>

      <!-- الترس الميكانيكي المتحرك (يسار) - أبعاد محسوبة بدقة مع شاشة الجوال (Galaxy S24 / iPhone) -->

      <!-- قطع الغيار والقرص الثابت (يمين) - أبعاد محسوبة بدقة مع شاشة الجوال وبدون أي تداخل -->

      <!-- صندوق الشعار -->
      <div class="brand-logo-pod" title="شعار كفو">

      </div>

        <h2 class="brand-subtitle">منظومة قطع غيار السيارات الذكية</h2>

      <p class="brand-prompt">اختر نوع حسابك للمتابعة</p>
    </section>

    <!-- =====================================================================
         قسم الإجراءات: كروت الأدوار مع فاصل رأسي واسع ومساحة تنفس مريحة
         ===================================================================== -->
    <section class="welcome-actions-section">
      <div class="roles-list-group" aria-label="خيارات تسجيل الدخول">

        <!-- 1. تاجر (أزرق كحلي ملكي راقي) -->
        <button type="button" class="role-action-card" onclick="openSubModal('merchant')">
          <div class="role-content-start">

          <div class="role-content-start">
            <div class="role-gradient-badge badge-workshop">

                <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                <path d="M9.3 6.3a1 1 0 0 1 0 1.4L7.7 9.3a1 1 0 0 1-1.4 0L2.53 5.53a6 6 0 0 0 7.94 7.94l6.91 6.91a2.12 2.12 0 0 0 3-3l-6.91-6.91a6 6 0 0 0-7.94-7.94l3.77-3.77z"/>

            <div class="role-texts-wrap">

          <div class="role-chevron-circle">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </div>
        </button>

        <!-- 4. مندوب توصيل (أزرق كوبالت حركي سريع) -->
        <button type="button" class="role-action-card" onclick="selectRoleAndEnter('courier')">
          <div class="role-content-start">
            <div class="role-gradient-badge badge-courier">
              <!-- شاحنة توصيل مع خطوط حركة سريعة -->
              <svg width="27" height="27" viewBox="0 0 24 24" fill="currentColor">
                <path d="M3 6.5h3v2H3v-2zm-2 4h5v2H1v-2zm2 4h3v2H3v-2zm5-10h9v4h4.5l2.5 3.3V17.5h-2c0 1.6-1.3 3-3 3s-3-1.4-3-3H11c0 1.6-1.3 3-3 3s-3-1.4-3-3H4V6.5c0-1.1.9-2 2-2h2zm11 11.5c.55 0 1-.45 1-1s-.45-1-1-1-1 .45-1 1 .45 1 1 1zm-11 0c.55 0 1-.45 1-1s-.45-1-1-1-1 .45-1 1 .45 1 1 1zm9-7.5v2.8h3.8l-1.8-2.8H17z"/>

            </div>
            <div class="role-texts-wrap">
              <strong class="role-card-name">مندوب توصيل</strong>
              <span class="role-card-desc">لمتابعة عمليات التوصيل</span>
            </div>
          </div>
          <div class="role-chevron-circle">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </div>
        </button>

      </div>

      <!-- =====================================================================
           زر: تصفح كعميل / زائر
           ===================================================================== -->
      <button type="button" class="visitor-btn-pill" onclick="selectRoleAndEnter('customer')" title="تصفح المتجر مباشرة">
        <!-- اليمين: أيقونة السماعة والخدمة -->
        <div class="visitor-content-center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
            <path d="M8 21v-1a4 4 0 0 1 4-4h1"></path>
          </svg>
          <span class="visitor-title-text">تصفح كعميل / زائر</span>
        </div>
        <!-- اليسار: سهم التنقل -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
    </section>

    <!-- =========================================================================
         تذييل الصفحة (عبارة "مع كفو ... كل قطعة في مكانها")
         ========================================================================= -->
    <footer class="welcome-footer-wrap">
      <div class="tagline-divider-row">
        <div class="tagline-line"></div>
        <span class="tagline-label">مع كفو ... كل قطعة في مكانها</span>
        <div class="tagline-line"></div>
      </div>
    </footer>

  </main>

  <!-- =========================================================================
       نافذة الاختيار الفرعي (Bottom Sheet) لاختيار نوع التاجر أو نوع المندوب
       ========================================================================= -->
  <div class="submodal-backdrop" id="subModalBackdrop" onclick="closeSubModal(event)">
    <div class="submodal-sheet" id="subModalSheet">
      <div class="submodal-handle"></div>
      
      <div class="submodal-header">
        <h3 class="submodal-title" id="subModalTitle">اختر نوع الحساب</h3>
        <p class="submodal-desc" id="subModalDesc">حدد تخصص نشاطك لبدء التجربة المخصصة</p>
      </div>

      <div class="submodal-options-list" id="subModalOptions">
        <!-- الخيارات تتغير برمجياً حسب الدور -->
      </div>

      <button type="button" class="submodal-cancel-btn" onclick="closeSubModalDirect()">إلغاء</button>
    </div>
  </div>

  <!-- =========================================================================
       نافذة تبديل اللغة (Language Selection Sheet)
       ========================================================================= -->
  <div class="lang-sheet-backdrop" id="langSheetBackdrop" onclick="closeLangSheet(event)">
    <div class="lang-sheet">
      <div class="submodal-handle"></div>
      <div class="submodal-header">
        <h3 class="submodal-title">اختر لغة التطبيق / Select Language</h3>
        <p class="submodal-desc">اختر لغة العرض المناسبة لك للمتابعة</p>
      </div>

      <button type="button" class="lang-item-btn selected" onclick="setLanguage('ar')">
        <span>العربية (Arabic)</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0066FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>

      <button type="button" class="lang-item-btn" onclick="setLanguage('en')">
        <span>English (الإنجليزية)</span>
        <span style="font-size: 0.8rem; color: #94A3B8;">قريباً</span>
      </button>

      <button type="button" class="submodal-cancel-btn" onclick="closeLangSheetDirect()">إغلاق</button>
    </div>
  </div>

  <!-- شاشة التحميل والانتقال السريع -->
  <div class="role-loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <span style="font-size: 0.95rem; font-weight: 700; color: #0A2540;" id="loadingText">جاري الانتقال...</span>
  </div>

  <!-- السكربتات البرمجية -->
  <script src="assets/js/products.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    // =========================================================================
    // التوافق التام مع محاكيات المتصفح وشاشات الهواتف بدون أي اهتزاز أو إعادة رسم
    // =========================================================================
    (function initFrameCompatibility() {
      if (window.self !== window.top) {
        document.documentElement.classList.add('in-mobile-frame');
        document.body.classList.add('in-mobile-frame');
      }
    })();

    // بيانات الأقسام الفرعية عند النقر على تاجر أو مندوب مبيعات
    const SUB_OPTIONS_DATA = {
      merchant: {
        title: 'اختر نوع نشاط التاجر',
        desc: 'اختر نشاط المتجر لعرض لوحة التحكم والأدوات المناسبة',
        options: [
          {
            roleId: 'merchant_new',
            title: 'تاجر قطع غيار جديدة',
            sub: 'عرض وبيع قطع الغيار الأصلية والبديلة بضمان المصنع'
          },
          {
            roleId: 'merchant_scrap',
            title: 'تاجر تشاليح ومستعمل',
            sub: 'بيع قطع التشاليح والسيارات المفككة والقطع المستعملة المضمونة'
          }
        ]
      },
      rep: {
        title: 'اختر تخصص مندوب المبيعات',
        desc: 'حدد مسار العمل لمتابعة عروض الأسعار والطلبات الفورية',
        options: [
          {
            roleId: 'rep_oem',
            title: 'مندوب مبيعات قطع أصلية (جديدة)',
            sub: 'إدارة طلبات ومبيعات الوكالات والمتاجر للقطع الجديدة'
          },
          {
            roleId: 'rep_scrap',
            title: 'مندوب مبيعات تشاليح ومستعمل',
            sub: 'التنسيق بين الورش ومحلات التشاليح لتوفير القطع النادرة'
          }
        ]
      }
    };

    // فتح وإغلاق النافذة المنبثقة السفلية للأدوار
    function openSubModal(categoryKey) {
      const data = SUB_OPTIONS_DATA[categoryKey];
      if (!data) return;

      document.getElementById('subModalTitle').textContent = data.title;
      document.getElementById('subModalDesc').textContent = data.desc;

      const container = document.getElementById('subModalOptions');
      container.innerHTML = '';

      data.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'submodal-opt-btn';
        btn.onclick = () => {
          closeSubModalDirect();
          selectRoleAndEnter(opt.roleId);
        };

        btn.innerHTML = `
          <div class="submodal-opt-info">
            <strong class="submodal-opt-title">${opt.title}</strong>
            <span class="submodal-opt-sub">${opt.sub}</span>
          </div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0066FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        `;

        container.appendChild(btn);
      });

      const backdrop = document.getElementById('subModalBackdrop');
      backdrop.classList.add('active');
    }

    function closeSubModal(event) {
      if (event.target === document.getElementById('subModalBackdrop')) {
        closeSubModalDirect();
      }
    }

    function closeSubModalDirect() {
      const backdrop = document.getElementById('subModalBackdrop');
      backdrop.classList.remove('active');
    }

    // فتح وإغلاق نافذة اللغة
    function openLangSheet() {
      const backdrop = document.getElementById('langSheetBackdrop');
      backdrop.classList.add('active');
    }

    function closeLangSheet(event) {
      if (event.target === document.getElementById('langSheetBackdrop')) {
        closeLangSheetDirect();
      }
    }

    function closeLangSheetDirect() {
      const backdrop = document.getElementById('langSheetBackdrop');
      backdrop.classList.remove('active');
    }

    function setLanguage(lang) {
      if (lang === 'ar') {
        document.getElementById('currentLangLabel').textContent = 'عربي';
        closeLangSheetDirect();
      } else {
        alert('الدعم الكامل للغة الإنجليزية قيد التجهيز وسيتم إطلاقه في التحديث القادم.');
        closeLangSheetDirect();
      }
    }

    // الانتقال وتفعيل الدور
    function selectRoleAndEnter(roleId) {
      const overlay = document.getElementById('loadingOverlay');
      const text = document.getElementById('loadingText');
      
      const roleTitles = {
        merchant_new: 'تاجر قطع جديدة',
        merchant_scrap: 'تاجر تشاليح',
        rep_oem: 'مندوب مبيعات (جديد)',
        rep_scrap: 'مندوب مبيعات (تشاليح)',
        workshop: 'مهندس ورشة',
        courier: 'مندوب توصيل',
        customer: 'عميل عادي'
      };

      if (overlay && text) {
        text.textContent = `جاري الانتقال: ${roleTitles[roleId] || ''}...`;
        overlay.classList.add('active');
      }

      // حفظ الدور في المتجر والجلسة
      if (window.KafuStore) {
        KafuStore.setRole(roleId);
      } else {
        localStorage.setItem('kafu_user_role', roleId);
      }
      sessionStorage.setItem('kafu_splash_passed', 'true');

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 350);
    }
  </script>
</body>
</html>
