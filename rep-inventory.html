<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>كفو | كتالوج وعينات المندوب</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/components.css">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #F1F5F9;
      font-family: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #0F172A;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .inv-page-shell {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 35px rgba(15, 23, 42, 0.06);
      position: relative;
    }

    .inv-top-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1.5px solid #E2E8F0;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-back-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #0F172A;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .header-back-btn:hover {
      background: #EFF6FF;
      border-color: #BFDBFE;
      color: #0066FF;
    }

    .inv-main-content {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
  </style>
</head>
<body>

  <div class="inv-page-shell">
    
    <!-- 1. الشريط العلوي مع زر الرجوع لصفحة الحساب -->
    <header class="inv-top-header">
      <div style="display: flex; align-items: center; gap: 10px;">
        <a href="account.html" class="header-back-btn" title="الرجوع إلى الحساب">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </a>
        <div>
          <h1 style="font-size: 1.15rem; font-weight: 900; color: #0A2540;">كتالوج وعينات المندوب</h1>
          <p style="font-size: 0.74rem; color: #64748B;">القطع المتاحة للترويج وحساب نسب العمولات</p>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 6px;">
        <a href="account.html" style="font-size: 0.76rem; background: #0066FF; color: #FFFFFF; padding: 6px 12px; border-radius: 8px; font-weight: 800; text-decoration: none;">
          + إضافة قطعة وعمولة
        </a>
      </div>
    </header>

    <!-- 2. المحتوى الأساسي والتحكم الكامل -->
    <main class="inv-main-content" id="inventoryMainContainer">
      <!-- يتم حقنه ديناميكياً بواسطة KafuMerchantInventory -->
    </main>

  </div>

  <!-- سكربتات التطبيق -->
  <script src="assets/js/products.js"></script>
  <script src="assets/js/store.js"></script>
  <script>
    const curRole = (window.KafuStore && KafuStore.getUserRole ? KafuStore.getUserRole() : localStorage.getItem('kafu_user_role')) || '';
    if (!curRole.includes('rep')) {
      window.__kafu_force_role = 'rep_oem';
    }
  </script>
  <script src="assets/js/merchant-inventory.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    function renderPage() {
      const container = document.getElementById('inventoryMainContainer');
      if (container && window.KafuMerchantInventory) {
        container.innerHTML = KafuMerchantInventory.renderModalContent(KafuMerchantInventory.activeTab, KafuMerchantInventory.searchQuery);
      }
    }

    const originalRefresh = KafuMerchantInventory.refreshModal.bind(KafuMerchantInventory);
    KafuMerchantInventory.refreshModal = function() {
      originalRefresh();
      renderPage();
    };

    document.addEventListener('DOMContentLoaded', () => {
      renderPage();
    });
  </script>
</body>
</html>
